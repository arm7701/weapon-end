          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -12),
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
      });
      updatePickCoordHud(lat, lng);
      syncMapEvent("pick_coord", [lat, lng]);
    }

    function clearPickedCoordinate() {
      pickCoordSource.entities.removeAll();
      updatePickCoordHud();
    }

    function setPickCoordMode(enabled) {
      pickCoordMode = !!enabled;
      if (pickCoordMode) {
        linkMode = false;
        routeAddMode = false;
        setMeasureMode(false);
        updatePickCoordHud();
      } else {
        pickCoordHud.style.display = "none";
      }
      updateMapCursor();
    }

    function setRouteAddMode(enabled) {
      routeAddMode = !!enabled;
      if (routeAddMode) {
        linkMode = false;
        setMeasureMode(false);
        setPickCoordMode(false);
        setFlightRouteEditMode(true);
      }
      updateMapCursor();
    }

    function pickLatLngFromClick(click) {
      const windowPosition = click.position;
      const scene = viewer.scene;
      let cartesian = undefined;
      // Prefer globe surface so pins land on imagery/terrain (not depth-buffer of floating entities).
      const ray = viewer.camera.getPickRay(windowPosition);
      if (ray) {
        cartesian = scene.globe.pick(ray, scene);
      }
      if (!Cesium.defined(cartesian)) {
        cartesian = viewer.camera.pickEllipsoid(
          windowPosition,
          scene.globe.ellipsoid
        );
      }
      if (!Cesium.defined(cartesian) && scene.pickPositionSupported) {
        cartesian = scene.pickPosition(windowPosition);
      }
      if (!Cesium.defined(cartesian)) {
        return null;
      }
      const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
      return [
        Cesium.Math.toDegrees(cartographic.latitude),
        Cesium.Math.toDegrees(cartographic.longitude),
      ];
    }

    function updateMapCursor() {
      if (
        measureMode ||
        pickCoordMode ||
        routePickMode ||
        routeAddMode ||
        flightRouteEditActive ||
        (detectionEditActive && detectionAddMode)
      ) {
        viewer.canvas.style.cursor = "crosshair";
      } else if (linkMode) {
        viewer.canvas.style.cursor = "cell";
      } else {
        viewer.canvas.style.cursor = "default";
      }
    }

    function setDetectionEditMode(enabled) {
      detectionEditActive = !!enabled;
      if (!detectionEditActive) {
        detectionAddMode = false;
        selectedDetectionId = null;
      }
      refreshDetectionHighlights();
      updateMapCursor();
    }

    function setDetectionAddMode(enabled) {
      detectionAddMode = !!enabled && detectionEditActive;
      updateMapCursor();
    }

    function highlightDetectionObject(objectId) {
      selectedDetectionId = objectId || null;
      refreshDetectionHighlights();
    }

    function refreshDetectionHighlights() {
      Object.entries(detectionEntities).forEach(([id, entity]) => {
        if (!entity || !entity.polygon) {
          return;
        }
        const item = entity.maapDetectionItem || {};
        const color = detectionColor(item.risk);
        const selected = id === selectedDetectionId;
        entity.polygon.outlineWidth = selected ? 5 : 3;
        entity.polygon.material = Cesium.Color.fromCssColorString(color).withAlpha(
          selected ? 0.38 : 0.22
        );
      });
    }

    function formatDistanceM(distanceM) {
      const meters = Math.max(distanceM || 0, 0);
      if (meters >= 1000) {
        return (meters / 1000).toFixed(2) + " km";
      }
      return Math.round(meters) + " m";
    }

    function geodesicDistanceM(lat1, lng1, lat2, lng2) {
      const start = Cesium.Cartographic.fromDegrees(lng1, lat1);
      const end = Cesium.Cartographic.fromDegrees(lng2, lat2);
      const geodesic = new Cesium.EllipsoidGeodesic(start, end);
      return geodesic.surfaceDistance;
    }

    function buildGeodesicPolylinePositions(points) {
      if (!points || points.length < 2) {
        return [];
      }
      const positions = [];
      const segmentsPerLeg = 32;
      for (let leg = 0; leg < points.length - 1; leg += 1) {
        const startPoint = points[leg];
        const endPoint = points[leg + 1];
        const start = Cesium.Cartographic.fromDegrees(startPoint[1], startPoint[0]);
        const end = Cesium.Cartographic.fromDegrees(endPoint[1], endPoint[0]);
        const geodesic = new Cesium.EllipsoidGeodesic(start, end);
        for (let i = 0; i <= segmentsPerLeg; i += 1) {
          if (leg > 0 && i === 0) {
            continue;
          }
          const sample = geodesic.interpolateUsingFraction(i / segmentsPerLeg);
          positions.push(
            Cesium.Cartesian3.fromRadians(sample.longitude, sample.latitude, 0)
          );
        }
      }
      return positions;
    }

    function midpointLatLng(lat1, lng1, lat2, lng2) {
      const start = Cesium.Cartographic.fromDegrees(lng1, lat1);
      const end = Cesium.Cartographic.fromDegrees(lng2, lat2);
      const geodesic = new Cesium.EllipsoidGeodesic(start, end);
      const mid = geodesic.interpolateUsingFraction(0.5);
      return [
        Cesium.Math.toDegrees(mid.latitude),
        Cesium.Math.toDegrees(mid.longitude),
      ];
    }

    function currentActiveRadiusM() {
      if (!measureState.activeRadius) {
        return 0;
      }
      const center = measureState.activeRadius.center;
      const edge = measureState.activeRadius.edge;
      return geodesicDistanceM(center[0], center[1], edge[0], edge[1]);
    }

    function emitMeasureUpdate() {
      const activeTotal = lineTerrainStats(measureState.activePoints).terrainM;
      const completedTotal = measureState.completedLines.reduce(
        (sum, line) => sum + line.totalM,
        0
      );
      const grandTotal = activeTotal + completedTotal;
      let radiusM = currentActiveRadiusM();
      if (!radiusM && measureState.completedCircles.length) {
        radiusM =
          measureState.completedCircles[measureState.completedCircles.length - 1]
            .radiusM;
      }
      document.title =
        "MAAP_SYNC|measure_update|" +
        grandTotal.toFixed(1) +
        "|" +
        radiusM.toFixed(1);
    }

    function measureHasContent() {
      return (
        measureState.completedLines.length > 0 ||
        measureState.completedCircles.length > 0 ||
        measureState.activePoints.length > 0 ||
        measureState.activeRadius !== null
      );
    }

    function updateMeasureHud() {
      if (!measureMode && !measureHasContent()) {
        measureHud.style.display = "none";
        return;
      }
      measureHud.style.display = "block";
      if (measureToolType === "radius") {
        measureHintEl.textContent =
          "คลิกกำหนดจุดศูนย์กลาง · เลื่อนเมาส์ดูรัศมี · คลิกอีกครั้งยืนยัน · คลิกขวายกเลิกวงปัจจุบัน";
      } else {
        measureHintEl.textContent =
          "คลิกเพิ่มจุด · คลิกขวา/ดับเบิลคลิกจบเส้น · ปุ่ม Clear ล้างทั้งหมด";
      }

      const activeStats = lineTerrainStats(measureState.activePoints);
      const activeTotal = activeStats.terrainM;
      const completedStats = measureState.completedLines.map((line) =>
        lineTerrainStats(line.points)
      );
      const completedTotal = completedStats.reduce((sum, s) => sum + s.terrainM, 0);
      const grandTotal = activeTotal + completedTotal;
      const grandHorizontal =
        activeStats.horizontalM +
        completedStats.reduce((sum, s) => sum + s.horizontalM, 0);
      const activeRadiusM = currentActiveRadiusM();
      const headerParts = [];
      if (measureToolType === "distance" || grandTotal > 0) {
        headerParts.push("ระยะตามพื้น " + formatDistanceM(grandTotal));
        if (grandTotal - grandHorizontal >= 1) {
          headerParts.push("ราบ " + formatDistanceM(grandHorizontal));
        }
      }
      if (measureToolType === "radius" || measureState.completedCircles.length) {
        const radiusLabel = activeRadiusM
          ? formatDistanceM(activeRadiusM)
          : measureState.completedCircles.length
            ? formatDistanceM(
                measureState.completedCircles[
                  measureState.completedCircles.length - 1
                ].radiusM
              )
            : "0 m";
        headerParts.push("รัศมี " + radiusLabel);
      }
      measureTotalEl.textContent = headerParts.join(" · ");

      const describeLine = (stats, points) =>
        "ตามพื้น " +
        formatDistanceM(stats.terrainM) +
        " · ราบ " +
        formatDistanceM(stats.horizontalM) +
        " · ขึ้น +" +
        Math.round(stats.climbM) +
        " / ลง −" +
        Math.round(stats.descentM) +
        " m · " +
        points.length +
        " จุด";
      const lines = [];
      measureState.completedLines.forEach((line, index) => {
        lines.push("เส้น " + (index + 1) + ": " + describeLine(completedStats[index], line.points));
      });
      if (measureState.activePoints.length >= 2) {
        lines.push(
          "เส้นปัจจุบัน: " + describeLine(activeStats, measureState.activePoints) + " (ยังไม่จบ)"
        );
      }
      if (measureState.activePoints.length || measureState.completedLines.length) {
        lines.push(terrainReady ? "อิงความสูง terrain (ArcGIS World Elevation)" : "terrain ยังไม่พร้อม — คำนวณบนพื้นราบ");
      }
      measureState.completedCircles.forEach((circle, index) => {
        lines.push(
          "วง " + (index + 1) + ": รัศมี " + formatDistanceM(circle.radiusM)
        );
      });
      if (measureState.activeRadius && activeRadiusM > 0) {
        lines.push(
          "วงปัจจุบัน: รัศมี " + formatDistanceM(activeRadiusM) + " (ยังไม่ยืนยัน)"
        );
      }
      measureSegmentsEl.textContent = lines.join("\n");
      emitMeasureUpdate();
    }

    function renderRadiusCircle(center, edge, options) {
      const preview = options && options.preview;
      const radiusM = geodesicDistanceM(center[0], center[1], edge[0], edge[1]);
      if (radiusM <= 0) {
        measureSource.entities.add({
          position: Cesium.Cartesian3.fromDegrees(center[1], center[0], 0),
          point: {
            pixelSize: 10,
            color: Cesium.Color.fromCssColorString("#34d399"),
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
          label: {
            text: "ศูนย์กลาง",
            font: "bold 14px sans-serif",
            fillColor: Cesium.Color.fromCssColorString("#6ee7b7"),
            outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -12),
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
        });
        return radiusM;
      }
      measureSource.entities.add({
        position: Cesium.Cartesian3.fromDegrees(center[1], center[0], 0),
        ellipse: {
          semiMajorAxis: radiusM,
          semiMinorAxis: radiusM,
          material: Cesium.Color.fromCssColorString("#34d399").withAlpha(
            preview ? 0.14 : 0.22
          ),
          outline: true,
          outlineColor: Cesium.Color.fromCssColorString(
            preview ? "#6ee7b7" : "#34d399"
          ),
          outlineWidth: preview ? 2 : 3,
          height: 0,
        },
      });
      const linePositions = buildGeodesicPolylinePositions([center, edge]);
      if (linePositions.length >= 2) {
        measureSource.entities.add({
          polyline: {
            positions: linePositions,
            width: preview ? 2 : 3,
            clampToGround: true,
            material: new Cesium.PolylineDashMaterialProperty({
              color: Cesium.Color.fromCssColorString("#6ee7b7").withAlpha(0.95),
              dashLength: 10,
            }),
          },
        });
      }
      const mid = midpointLatLng(center[0], center[1], edge[0], edge[1]);
      measureSource.entities.add({
        position: Cesium.Cartesian3.fromDegrees(center[1], center[0], 0),
        point: {
          pixelSize: 10,
          color: Cesium.Color.fromCssColorString("#34d399"),
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
      });
      measureSource.entities.add({
        position: Cesium.Cartesian3.fromDegrees(edge[1], edge[0], 0),
        point: {
          pixelSize: 8,
          color: Cesium.Color.fromCssColorString("#a7f3d0"),
          outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
          outlineWidth: 2,
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
      });
      measureSource.entities.add({
        position: Cesium.Cartesian3.fromDegrees(mid[1], mid[0], 0),
        label: {
          text: "R " + formatDistanceM(radiusM),
          font: "bold 15px sans-serif",
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.fromCssColorString("#064e3b"),
          outlineWidth: 3,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -8),
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
          showBackground: true,
          backgroundColor: Cesium.Color.fromCssColorString("#047857").withAlpha(0.88),
          backgroundPadding: new Cesium.Cartesian2(8, 5),
        },
      });
      return radiusM;
    }

    function renderMeasureGraphics() {
      measureSource.entities.removeAll();
      const allLines = measureState.completedLines.map((line) => line.points);
      if (measureState.activePoints.length >= 2) {
        allLines.push(measureState.activePoints);
      } else if (measureState.activePoints.length === 1) {
        const point = measureState.activePoints[0];
        measureSource.entities.add({
          position: Cesium.Cartesian3.fromDegrees(point[1], point[0], 0),
          point: {
            pixelSize: 9,
            color: Cesium.Color.fromCssColorString("#fbbf24"),
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
        });
        clampMeasureEntitiesToGround();
        updateMeasureHud();
        return;
      }

      allLines.forEach((points, lineIndex) => {
        const positions = buildGeodesicPolylinePositions(points);
        if (positions.length < 2) {
          return;
        }
        const isActive =
          lineIndex === allLines.length - 1 &&
          measureState.activePoints.length >= 2;
        measureSource.entities.add({
          polyline: {
            positions,
            width: isActive ? 5 : 4,
            clampToGround: true,
            material: isActive
              ? new Cesium.PolylineDashMaterialProperty({
                  color: Cesium.Color.fromCssColorString("#fbbf24").withAlpha(0.95),
                  dashLength: 14,
                })
              : Cesium.Color.fromCssColorString("#fbbf24").withAlpha(0.95),
          },
        });
        for (let i = 0; i < points.length - 1; i += 1) {
          const dist = measureSegmentStats(points[i], points[i + 1]).terrainM;
          const mid = midpointLatLng(
            points[i][0],
            points[i][1],
            points[i + 1][0],
            points[i + 1][1]
          );
          measureSource.entities.add({
            position: Cesium.Cartesian3.fromDegrees(mid[1], mid[0], 0),
            label: {
              text: formatDistanceM(dist),
              font: "bold 14px sans-serif",
              fillColor: Cesium.Color.fromCssColorString("#fde68a"),
              outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
              outlineWidth: 3,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              pixelOffset: new Cesium.Cartesian2(0, -8),
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
              showBackground: true,
              backgroundColor: Cesium.Color.fromCssColorString("#0f172a").withAlpha(0.72),
              backgroundPadding: new Cesium.Cartesian2(6, 4),
            },
          });
        }
        points.forEach((point, pointIndex) => {
          measureSource.entities.add({
            position: Cesium.Cartesian3.fromDegrees(point[1], point[0], 0),
            point: {
              pixelSize: pointIndex === 0 || pointIndex === points.length - 1 ? 10 : 8,
              color: Cesium.Color.fromCssColorString("#fbbf24"),
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2,
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
            },
          });
        });
        const total = lineTerrainStats(points).terrainM;
        const end = points[points.length - 1];
        measureSource.entities.add({
          position: Cesium.Cartesian3.fromDegrees(end[1], end[0], 0),
          label: {
            text: "Σ " + formatDistanceM(total),
            font: "bold 15px sans-serif",
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.TOP,
            pixelOffset: new Cesium.Cartesian2(0, 10),
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
            showBackground: true,
            backgroundColor: Cesium.Color.fromCssColorString("#b45309").withAlpha(0.88),
            backgroundPadding: new Cesium.Cartesian2(8, 5),
          },
        });
      });

      measureState.completedCircles.forEach((circle) => {
        renderRadiusCircle(circle.center, circle.edge, { preview: false });
      });
      if (measureState.activeRadius) {
        renderRadiusCircle(
          measureState.activeRadius.center,
          measureState.activeRadius.edge,
          { preview: true }
        );
      }
      clampMeasureEntitiesToGround();
      updateMeasureHud();
    }

    function clampMeasureEntitiesToGround() {
      const clamp = Cesium.HeightReference.CLAMP_TO_GROUND;
      measureSource.entities.values.forEach((entity) => {
        if (entity.point) entity.point.heightReference = clamp;
        if (entity.label) entity.label.heightReference = clamp;
        if (entity.ellipse) {
          entity.ellipse.heightReference = clamp;
          entity.ellipse.classificationType = Cesium.ClassificationType.BOTH;
        }
      });
    }

    function pickMeasureLatLng(event) {
      const scene = viewer.scene;
      let cartesian;
      const ray = viewer.camera.getPickRay(event.position);
      if (ray) {
        cartesian = scene.globe.pick(ray, scene);
      }
      if (!Cesium.defined(cartesian)) {
        cartesian = viewer.camera.pickEllipsoid(event.position, scene.globe.ellipsoid);
      }
      if (!Cesium.defined(cartesian)) {
        return null;
      }
      const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
      return [
        Cesium.Math.toDegrees(cartographic.latitude),
        Cesium.Math.toDegrees(cartographic.longitude),
        Number.isFinite(cartographic.height) ? cartographic.height : 0,
      ];
    }

    function globeSurfaceHeightM(lat, lng) {
      const h = viewer.scene.globe.getHeight(Cesium.Cartographic.fromDegrees(lng, lat));
      return Number.isFinite(h) ? h : null;
    }

    const MEASURE_SAMPLE_SPACING_M = 10;
    const MEASURE_MAX_SAMPLES_PER_LEG = 256;
    const measureTerrainCache = new Map();
    let measureRefineTimer = null;
    let measureRefineBusy = false;

    function measureSegmentKey(a, b) {
      return [a[0], a[1], b[0], b[1]].map((v) => v.toFixed(7)).join(",");
    }

    function measureLegSamples(a, b) {
      const start = Cesium.Cartographic.fromDegrees(a[1], a[0]);
      const end = Cesium.Cartographic.fromDegrees(b[1], b[0]);
      const geodesic = new Cesium.EllipsoidGeodesic(start, end);
      const horizontalM = geodesic.surfaceDistance || 0;
      const count = Math.min(
        MEASURE_MAX_SAMPLES_PER_LEG,
        Math.max(2, Math.ceil(horizontalM / MEASURE_SAMPLE_SPACING_M))
      );
      const samples = [];
      for (let i = 0; i <= count; i += 1) {
        samples.push(geodesic.interpolateUsingFraction(i / count));
      }
      return { horizontalM, samples };
    }

    function profileStats(horizontalM, heights) {
      const steps = heights.length - 1;
      const stepM = steps > 0 ? horizontalM / steps : 0;
      let terrainM = 0;
      let climbM = 0;
      let descentM = 0;
      for (let i = 0; i < steps; i += 1) {
        const dh = heights[i + 1] - heights[i];
        terrainM += Math.hypot(stepM, dh);
        if (dh > 0) climbM += dh;
        else descentM -= dh;
      }
      return {
        horizontalM,
        terrainM: Math.max(terrainM, horizontalM),
        climbM,
        descentM,
        startH: heights[0],
        endH: heights[heights.length - 1],
      };
    }

    function measureSegmentStats(a, b) {
      const cached = measureTerrainCache.get(measureSegmentKey(a, b));
      if (cached) {
        return cached;
      }
      const { horizontalM, samples } = measureLegSamples(a, b);
      const ha = Number.isFinite(a[2]) ? a[2] : globeSurfaceHeightM(a[0], a[1]) || 0;
      const hb = Number.isFinite(b[2]) ? b[2] : globeSurfaceHeightM(b[0], b[1]) || 0;
      const last = samples.length - 1;
      const heights = samples.map((s, i) => {
        const h = viewer.scene.globe.getHeight(s);
        return Number.isFinite(h) ? h : ha + ((hb - ha) * i) / Math.max(last, 1);
      });
      return Object.assign(profileStats(horizontalM, heights), { refined: false });
    }

    function lineTerrainStats(points) {
      const total = { horizontalM: 0, terrainM: 0, climbM: 0, descentM: 0 };
      for (let i = 0; i < points.length - 1; i += 1) {
        const s = measureSegmentStats(points[i], points[i + 1]);
        total.horizontalM += s.horizontalM;
        total.terrainM += s.terrainM;
        total.climbM += s.climbM;
        total.descentM += s.descentM;
      }
      return total;
    }

    function scheduleMeasureTerrainRefine() {
      if (measureRefineTimer) {
        clearTimeout(measureRefineTimer);
      }
      measureRefineTimer = setTimeout(refineMeasureTerrain, 250);
    }

    async function refineMeasureTerrain() {
      measureRefineTimer = null;
      if (!terrainReady || measureRefineBusy) {
        return;
      }
      const lines = measureState.completedLines.map((line) => line.points);
      if (measureState.activePoints.length >= 2) {
        lines.push(measureState.activePoints);
      }
      const pending = [];
      lines.forEach((points) => {
        for (let i = 0; i < points.length - 1; i += 1) {
          const key = measureSegmentKey(points[i], points[i + 1]);
          if (!measureTerrainCache.has(key)) {
            pending.push({ key, leg: measureLegSamples(points[i], points[i + 1]) });
          }
        }
      });
      if (!pending.length) {
        return;
      }
      measureRefineBusy = true;
      try {
        const cartos = [];
        pending.forEach((item) => {
          item.leg.samples.forEach((s) => cartos.push(s.clone()));
        });
        const sampled = await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, cartos);
        let offset = 0;
        pending.forEach((item) => {
          const n = item.leg.samples.length;
          const heights = sampled
            .slice(offset, offset + n)
            .map((c) => (Number.isFinite(c.height) ? c.height : 0));
          offset += n;
          measureTerrainCache.set(
            item.key,
            Object.assign(profileStats(item.leg.horizontalM, heights), { refined: true })
          );
        });
        measureState.completedLines.forEach((line) => {
          line.totalM = lineTerrainStats(line.points).terrainM;
        });
        renderMeasureGraphics();
      } catch (error) {
        console.warn("Terrain sampling for measure failed", error);
      } finally {
        measureRefineBusy = false;
      }
    }

    function addMeasurePoint(lat, lng, heightM) {
      const points = measureState.activePoints;
      const prev = points[points.length - 1];
      // LEFT_DOUBLE_CLICK is preceded by two LEFT_CLICKs on the same spot.
      if (prev && geodesicDistanceM(prev[0], prev[1], lat, lng) < 0.5) {
        return;
      }
      points.push([lat, lng, Number.isFinite(heightM) ? heightM : 0]);
      renderMeasureGraphics();
      scheduleMeasureTerrainRefine();
    }

    function handleRadiusClick(lat, lng) {
      if (!measureState.activeRadius) {
        measureState.activeRadius = {
          center: [lat, lng],
          edge: [lat, lng],
        };
        renderMeasureGraphics();
        return;
      }
      const radiusM = geodesicDistanceM(
        measureState.activeRadius.center[0],
        measureState.activeRadius.center[1],
        lat,
        lng
      );
      if (radiusM < 1) {
        return;
      }
      measureState.completedCircles.push({
        center: measureState.activeRadius.center.slice(),
        edge: [lat, lng],
        radiusM,
      });
      measureState.activeRadius = null;
      renderMeasureGraphics();
    }

    function cancelActiveRadius() {
      measureState.activeRadius = null;
      renderMeasureGraphics();
    }

    function finishActiveMeasureLine() {
      if (measureState.activePoints.length < 2) {
        measureState.activePoints = [];
        renderMeasureGraphics();
        return;
      }
      measureState.completedLines.push({
        points: measureState.activePoints.slice(),
        totalM: lineTerrainStats(measureState.activePoints).terrainM,
      });
      measureState.activePoints = [];
      renderMeasureGraphics();
    }

    function clearMeasure() {
      measureState.activePoints = [];
      measureState.completedLines = [];
      measureState.activeRadius = null;
      measureState.completedCircles = [];
      measureTerrainCache.clear();
      measureSource.entities.removeAll();
      updateMeasureHud();
      document.title = "MAAP_SYNC|measure_update|0|0";
    }

    function setMeasureType(toolType) {
      const nextType = toolType === "radius" ? "radius" : "distance";
      if (nextType === measureToolType) {
        return;
      }
      finishActiveMeasureLine();
      cancelActiveRadius();
      measureToolType = nextType;
      updateMeasureHud();
    }

    function setMeasureMode(enabled) {
      measureMode = !!enabled;
      if (measureMode) {
        linkMode = false;
        pickCoordMode = false;
        pickCoordHud.style.display = "none";
        measureHud.style.display = "block";
      } else {
        finishActiveMeasureLine();
        cancelActiveRadius();
        if (!measureHasContent()) {
          measureHud.style.display = "none";
        }
      }
      updateMapCursor();
      updateMeasureHud();
    }

    function fitToTarget(lat, lng, focusRadiusM) {
      const height = cameraHeightForRadiusM(focusRadiusM);
      flyToDegrees(lng, lat, height, 1.0);
    }

    function emitDetectionReady(tileWaitMs) {
      const wait = tileWaitMs || 700;
      setTimeout(function () {
        document.title = "MAAP_SYNC|detection_ready|" + Date.now();
      }, wait);
    }

    function fitToDetectionArea(lat, lng, radiusM) {
      const radius = Math.max(radiusM || 20, 20);
      const tileWaitMs = Math.min(1500, Math.max(800, 2200 - radius * 5));
      const latDelta = radius / 111320.0;
      const lngScale = Math.max(Math.cos(Cesium.Math.toRadians(lat)), 0.1);
      const lngDelta = radius / (111320.0 * lngScale);
      const rectangle = Cesium.Rectangle.fromDegrees(
        lng - lngDelta,
        lat - latDelta,
        lng + lngDelta,
        lat + latDelta
      );
      let readyEmitted = false;
      function emitOnce() {
        if (readyEmitted) {
          return;
        }
        readyEmitted = true;
        emitDetectionReady(tileWaitMs);
      }
      viewer.camera.flyTo({
        destination: rectangle,
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-90),
          roll: 0,
        },
        duration: 0.9,
        complete: emitOnce,
        cancel: emitOnce,
      });
      setTimeout(emitOnce, tileWaitMs + 1200);
    }

    function fitToTargetCard(targetCardId) {
      const markers = targetMarkersForCard(targetCardId);
      if (!markers.length) {
        return;
      }
      if (markers.length === 1) {
        const item = markers[0];
        fitToTarget(item.lat, item.lng, maxTargetFocusRadiusM(item));
        return;
      }
      let minLat = markers[0].lat;
      let maxLat = markers[0].lat;
      let minLng = markers[0].lng;
      let maxLng = markers[0].lng;
      let maxRadius = 0;
      for (let i = 0; i < markers.length; i += 1) {
        const item = markers[i];
        minLat = Math.min(minLat, item.lat);
        maxLat = Math.max(maxLat, item.lat);
        minLng = Math.min(minLng, item.lng);
        maxLng = Math.max(maxLng, item.lng);
        maxRadius = Math.max(maxRadius, maxTargetFocusRadiusM(item));
      }
      const centerLat = (minLat + maxLat) / 2;
      const centerLng = (minLng + maxLng) / 2;
      const spanM = Math.max(
        geodesicDistanceM(centerLat, centerLng, minLat, minLng),
        geodesicDistanceM(centerLat, centerLng, maxLat, maxLng),
        maxRadius
      );
      fitToTarget(centerLat, centerLng, spanM * 2.4);
    }

    function markerForIngressCorridor(targetCardId, coordinateId) {
      const markers = targetMarkersForCard(targetCardId);
      if (!markers.length) {
        return null;
      }
      if (coordinateId) {
        return (
          markers.find((item) => (item.coordinateId || null) === coordinateId) ||
          markers[0]
        );
      }
      return (
        markers.find((item) => item.isPrimary !== false) ||
        markers[0]
      );
    }

    function ingressOptionForMarker(marker, rank) {
      if (!marker || !marker.lowestRiskDirection || !marker.lowestRiskDirection.available) {
        return null;
      }
      const options = (marker.lowestRiskDirection.recommendedOptions || []).slice(0, 3);
      return (
        options.find((option) => Number(option.rank || 0) === rank) ||
        options[rank - 1] ||
        null
      );
    }

    function fitToIngressCorridor(targetCardId, coordinateId, rank) {
      const marker = markerForIngressCorridor(targetCardId, coordinateId);
      if (!marker) {
        fitToTargetCard(targetCardId);
        return;
      }
      const option = ingressOptionForMarker(marker, rank);
      if (!option) {
        fitToTarget(marker.lat, marker.lng, maxTargetFocusRadiusM(marker));
        return;
      }
      const route = option.borderRoute || {};
      const points = [[marker.lat, marker.lng]];
      if (route.nearestBorder) {
        points.push([Number(route.nearestBorder.lat), Number(route.nearestBorder.lng)]);
      }
      if (route.entry) {
        points.push([Number(route.entry.lat), Number(route.entry.lng)]);
      }
      if (route.exit) {
        points.push([Number(route.exit.lat), Number(route.exit.lng)]);
      }
      const tip = destinationFromBearing(
        marker.lat,
        marker.lng,
        Number(option.bearingDeg || 0),
        Math.max(Number(marker.lowestRiskDirection.arrowLengthM || 0), 40) *
          (rank === 1 ? 1.0 : rank === 2 ? 0.88 : 0.76)
      );
      points.push([tip.lat, tip.lng]);
      let minLat = points[0][0];
      let maxLat = points[0][0];
      let minLng = points[0][1];
      let maxLng = points[0][1];
      for (let i = 1; i < points.length; i += 1) {
        minLat = Math.min(minLat, points[i][0]);
        maxLat = Math.max(maxLat, points[i][0]);
        minLng = Math.min(minLng, points[i][1]);
        maxLng = Math.max(maxLng, points[i][1]);
      }
      const centerLat = (minLat + maxLat) / 2;
      const centerLng = (minLng + maxLng) / 2;
      const spanM = Math.max(
        geodesicDistanceM(centerLat, centerLng, minLat, minLng),
        geodesicDistanceM(centerLat, centerLng, maxLat, maxLng),
        maxTargetFocusRadiusM(marker) * 0.35
      );
      fitToTarget(centerLat, centerLng, Math.max(spanM * 2.8, 2500));
    }

    function clearIngressCorridorFlightRoute() {
      corridorFlightSource.entities.removeAll();
    }

    function addCorridorFlightPolyline(positions, options) {
      if (!positions || positions.length < 2) {
        return;
      }
      const use3d = !!options.use3d;
      corridorFlightSource.entities.add({
        polyline: {
          positions: positions,
          width: options.width || 6,
          clampToGround: !use3d,
          material: options.dashed
            ? new Cesium.PolylineDashMaterialProperty({
                color: options.color,
                dashLength: 18,
              })
            : new Cesium.PolylineArrowMaterialProperty({
                color: options.color,
              }),
        },
      });
    }

    function addEditableFlightRouteWaypoints(item) {
      if (item.showWaypoints === false) {
        return;
      }
      const editable = item.editableWaypoints || [];
      const selectedId = item.selectedWaypointId || null;
      const showLabels = item.showWaypointLabels === true;
      editable.forEach((waypoint, index) => {
        const selected = waypoint.id === selectedId;
        const label = waypoint.label || "WP" + (index + 1);
        const altM = (waypoint.altitudeFt || 0) * FT_TO_M;
        const entitySpec = {
          position: Cesium.Cartesian3.fromDegrees(
            Number(waypoint.lng),
            Number(waypoint.lat),
            Math.max(altM, altM > 0 ? altM : 120)
          ),
          point: {
            pixelSize: selected ? 14 : 12,
            color: Cesium.Color.fromCssColorString(
              selected ? "#22d3ee" : "#38bdf8"
            ),
            outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
            outlineWidth: selected ? 3 : 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
        };
        if (showLabels) {
          entitySpec.label = {
            text:
              label +
              "\n" +
              Number(waypoint.lat).toFixed(5) +
              (waypoint.altitudeFt ? "\n" + waypoint.altitudeFt + " ft" : ""),
            font: "bold 11px sans-serif",
            fillColor: Cesium.Color.fromCssColorString(
              selected ? "#22d3ee" : "#7dd3fc"
            ),
            outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -12),
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          };
        }
        const entity = corridorFlightSource.entities.add(entitySpec);
        entity.maapMeta = {
          type: "flight_route_waypoint",
          id: waypoint.id,
          editable: true,
        };
      });
    }

    function setFlightRouteEditMode(enabled) {
      flightRouteEditActive = !!enabled;
      if (!flightRouteEditActive) {
        routeAddMode = false;
        routeDragState = null;
        viewer.scene.screenSpaceCameraController.enableRotate = true;
        viewer.scene.screenSpaceCameraController.enableTranslate = true;
      }
      updateMapCursor();
    }

    function bearingBetween(lat1, lng1, lat2, lng2) {
      const phi1 = Cesium.Math.toRadians(lat1);
      const phi2 = Cesium.Math.toRadians(lat2);
      const deltaLng = Cesium.Math.toRadians(lng2 - lng1);
      const y = Math.sin(deltaLng) * Math.cos(phi2);
      const x =
        Math.cos(phi1) * Math.sin(phi2) -
        Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLng);
      return (Cesium.Math.toDegrees(Math.atan2(y, x)) + 360) % 360;
    }

    function buildWaypointConnectorPositions3d(path3d) {
      if (!path3d || path3d.length < 2) {
        return [];
      }
      const positions = [];
      for (let index = 0; index < path3d.length - 1; index += 1) {
        const start = path3d[index];
        const end = path3d[index + 1];
        const spanM = geodesicDistanceM(start[0], start[1], end[0], end[1]);
        const steps = Math.max(Math.ceil(spanM / 6000), 2);
        for (let step = 0; step <= steps; step += 1) {
          const t = step / steps;
          const point =
            step === 0
              ? { lat: start[0], lng: start[1] }
              : step === steps
                ? { lat: end[0], lng: end[1] }
                : destinationFromBearing(
                    start[0],
                    start[1],
                    bearingBetween(start[0], start[1], end[0], end[1]),
                    spanM * t
                  );
          const altM = (start[2] || 0) + ((end[2] || 0) - (start[2] || 0)) * t;
          positions.push(
            Cesium.Cartesian3.fromDegrees(point.lng, point.lat, Math.max(altM, 80))
          );
        }
      }
      return positions;
    }

    function sortAiWaypoints(waypoints, prefix) {
      return (waypoints || [])
        .filter(function (wp) {
          const id = String(wp.id || "");
          const label = String(wp.label || "");
          return id.indexOf(prefix) === 0 || label.indexOf(prefix) === 0;
        })
        .sort(function (a, b) {
          const na = parseInt(String(a.label || a.id).replace(/\D/g, ""), 10) || 0;
          const nb = parseInt(String(b.label || b.id).replace(/\D/g, ""), 10) || 0;
          return na - nb;
        });
    }

    function buildWaypointConnectorPath3dFromItem(item) {
      if (item.waypointConnectorPath3d && item.waypointConnectorPath3d.length >= 2) {
        return item.waypointConnectorPath3d;
      }
      const editable = item.editableWaypoints || [];
      const takeoff = item.takeoff || item.origin;
      if (!editable.length || !takeoff || takeoff.length < 2) {
        return [];
      }
      const outbound = sortAiWaypoints(editable, "AI-OUT");
      const rtb = sortAiWaypoints(editable, "AI-RTB");
      const defaultAlt =
        Number(item.cruiseAltitudeFt) > 0
          ? Number(item.cruiseAltitudeFt) * FT_TO_M
          : Number(item.prefAglM) || 105;
      const chain = [];
      chain.push([Number(takeoff[0]), Number(takeoff[1]), defaultAlt]);
      outbound.forEach(function (wp) {
        const altM = Number(wp.altitudeFt || 0) * FT_TO_M;
        chain.push([Number(wp.lat), Number(wp.lng), altM > 0 ? altM : defaultAlt]);
      });
      const borderEntry = item.borderEntry;
      if (borderEntry && borderEntry.length >= 2) {
        chain.push([Number(borderEntry[0]), Number(borderEntry[1]), defaultAlt]);
      }
      const dest = item.destination;
      if (dest && dest.length >= 2) {
        chain.push([Number(dest[0]), Number(dest[1]), defaultAlt]);
      }
      const borderExit = item.borderExit;
      if (borderExit && borderExit.length >= 2) {
        chain.push([Number(borderExit[0]), Number(borderExit[1]), defaultAlt]);
      }
      rtb.forEach(function (wp) {
        const altM = Number(wp.altitudeFt || 0) * FT_TO_M;
        chain.push([Number(wp.lat), Number(wp.lng), altM > 0 ? altM : defaultAlt]);
      });
      chain.push([Number(takeoff[0]), Number(takeoff[1]), defaultAlt]);
      return chain;
    }

    function buildWaypointConnectorPath2dFromItem(item) {
      if (item.waypointConnectorRoute && item.waypointConnectorRoute.length >= 2) {
        return item.waypointConnectorRoute;
      }
      const path3d = buildWaypointConnectorPath3dFromItem(item);
      return path3d.map(function (point) {
        return [Number(point[0]), Number(point[1])];
      });
    }

    function drawSequentialWaypointLegs(item) {
      const legs = buildWaypointConnectorPath2dFromItem(item);
      if (legs.length < 2) {
        return;
      }
      const routeColor = item.routeColor || "#38bdf8";
      for (let index = 0; index < legs.length - 1; index += 1) {
        const segment = [legs[index], legs[index + 1]];
        const positions = buildGeodesicRoutePositions(segment);
        addCorridorFlightPolyline(positions, {
          width: 6,
          color: Cesium.Color.fromCssColorString(routeColor).withAlpha(0.92),
        });
      }
    }

    function addCorridorFlightRoute(item) {
      if (!item) {
        return;
      }
      setFlightRouteEditMode(!!item.routeEditEnabled);
      const outboundRoute = item.outboundRoute || [];
      const returnRoute = item.returnRoute || [];
      const routeColor = item.routeColor || "#38bdf8";
      const returnColor = Cesium.Color.fromCssColorString("#22d3ee").withAlpha(0.82);
      const useUnified = item.unifiedRoute === true;
      const showReturnRoute = !useUnified && item.showReturnRoute !== false;
      let outbound3d = item.path3d || [];
      let return3d = item.returnPath3d || [];
      if (item.useTerrainAgl && outbound3d.length >= 2) {
        outbound3d = applyTerrainAglToPath3d(
          outbound3d,
          item.prefAglM,
          item.minAglM,
          item.maxAglM
        );
        if (return3d.length >= 2) {
          return3d = applyTerrainAglToPath3d(
            return3d,
            item.prefAglM,
            item.minAglM,
            item.maxAglM
          );
        }
      }
      const connectorPath3d = buildWaypointConnectorPath3dFromItem(item);
      const shouldDrawWaypointLegs =
        item.drawWaypointConnectors !== false &&
        connectorPath3d.length >= 2 &&
        (item.routeEditEnabled || useUnified);

      if (useUnified) {
        if (shouldDrawWaypointLegs) {
          drawSequentialWaypointLegs(item);
        } else {
          let unified3d = item.unifiedPath3d || [];
          if (!unified3d.length && outbound3d.length >= 2) {
            unified3d = outbound3d.concat((return3d || []).slice(1));
          }
          if (item.useTerrainAgl && unified3d.length >= 2) {
            unified3d = applyTerrainAglToPath3d(
              unified3d,
              item.prefAglM,
              item.minAglM,
              item.maxAglM
            );
          }
          if (unified3d.length >= 2) {
            addCorridorFlightPolyline(buildPath3dPositions(unified3d), {
              width: 8,
              color: Cesium.Color.fromCssColorString(routeColor).withAlpha(0.95),
              use3d: true,
            });
          }
        }
      } else if (shouldDrawWaypointLegs) {
        drawSequentialWaypointLegs(item);
      } else if (outbound3d.length >= 2) {
        addCorridorFlightPolyline(buildPath3dPositions(outbound3d), {
          width: 8,
          color: Cesium.Color.fromCssColorString(routeColor).withAlpha(0.95),
          use3d: true,
        });
      } else if (outboundRoute.length >= 2) {
        addCorridorFlightPolyline(buildGeodesicRoutePositions(outboundRoute), {
          width: 8,
          color: Cesium.Color.fromCssColorString(routeColor).withAlpha(0.95),
        });
      }
      let returnDrawn = false;
      if (showReturnRoute && return3d.length >= 2) {
        addCorridorFlightPolyline(buildPath3dPositions(return3d), {
          width: 6,
          dashed: true,
          color: returnColor,
          use3d: true,
        });
        returnDrawn = true;
      }
      if (showReturnRoute && !returnDrawn && returnRoute.length >= 2) {
        addCorridorFlightPolyline(buildGeodesicRoutePositions(returnRoute), {
          width: 6,
          dashed: true,
          color: returnColor,
        });
      }
      const markers = item.routeMarkers || [];
      const sketchMode = item.routeStyle === "waypoint_polyline";
      const routeEditMode = !!item.routeEditEnabled;
      markers.forEach((marker) => {
        if (
          (sketchMode || routeEditMode) &&
          marker.pointType !== "takeoff" &&
          marker.pointType !== "target"
        ) {
          return;
        }
        const colors = {
          takeoff: "#4ade80",
          target: "#f87171",
          ingress: "#fbbf24",
          return: "#fbbf24",
        };
        const color = colors[marker.pointType] || "#f59e0b";
        corridorFlightSource.entities.add({
          position: Cesium.Cartesian3.fromDegrees(marker.lng, marker.lat, 180),
          point: {
            pixelSize: 10,
            color: Cesium.Color.fromCssColorString(color),
            outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
            outlineWidth: 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
          label: {
            text:
              (marker.routeCode || marker.label || "WP") +
              (marker.label && marker.routeCode ? "\n" + marker.label : ""),
            font: "bold 11px sans-serif",
            fillColor: Cesium.Color.fromCssColorString(color),
            outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -10),
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
        });
      });
      addEditableFlightRouteWaypoints(item);
      if (item.drawWaypointConnectors && (item.waypointConnectorPath3d || []).length >= 2) {
        const takeoff = item.takeoff || item.origin;
        if (takeoff && takeoff.length >= 2) {
          corridorFlightSource.entities.add({
            position: Cesium.Cartesian3.fromDegrees(takeoff[1], takeoff[0], 180),
            point: {
              pixelSize: 12,
              color: Cesium.Color.fromCssColorString("#4ade80"),
              outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
              outlineWidth: 2,
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
            },
            label: {
              text: "TO\nกองบิน",
              font: "bold 11px sans-serif",
              fillColor: Cesium.Color.fromCssColorString("#4ade80"),
              outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              pixelOffset: new Cesium.Cartesian2(0, -10),
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
            },
          });
        }
      }
    }

    function fitToCorridorFlightRoute(item) {
      if (!item) {
        return;
      }
      const points = []
        .concat(item.outboundRoute || [])
        .concat((item.returnRoute || []).slice(1));
      if (!points.length) {
        return;
      }
      let minLat = points[0][0];
      let maxLat = points[0][0];
      let minLng = points[0][1];
      let maxLng = points[0][1];
      for (let i = 1; i < points.length; i += 1) {
        minLat = Math.min(minLat, points[i][0]);
        maxLat = Math.max(maxLat, points[i][0]);
        minLng = Math.min(minLng, points[i][1]);
        maxLng = Math.max(maxLng, points[i][1]);
      }
      const centerLat = (minLat + maxLat) / 2;
      const centerLng = (minLng + maxLng) / 2;
      const spanM = Math.max(
        geodesicDistanceM(centerLat, centerLng, minLat, minLng),
        geodesicDistanceM(centerLat, centerLng, maxLat, maxLng)
      );
      fitToTarget(centerLat, centerLng, Math.max(spanM * 2.6, 8000));
    }

    function updateCorridorFlightRoute(item) {
      if (!ingressCorridorFocus) {
        return;
      }
      clearIngressCorridorFlightRoute();
      if (item) {
        addCorridorFlightRoute(item);
      }
    }

    function highlightIngressCorridor(targetCardId, coordinateId, rank, flightRoute) {
      selectedTargetId = targetCardId;
      clearIngressCorridorFlightRoute();
      if (!rank) {
        ingressCorridorFocus = null;
        setFlightRouteEditMode(false);
        drawRiskDirectionForTarget(targetCardId);
        fitToTargetCard(targetCardId);
        return;
      }
      ingressCorridorFocus = {
        targetCardId: targetCardId,
        coordinateId: coordinateId || null,
        rank: rank,
      };
      drawRiskDirectionForTarget(targetCardId);
      if (flightRoute) {
        addCorridorFlightRoute(flightRoute);
        if (flightRoute.fitToRoute !== false) {
          fitToCorridorFlightRoute(flightRoute);
        }
      } else {
        fitToIngressCorridor(targetCardId, coordinateId, rank);
      }
    }

    function fitToScenario() {
      flyToDegrees(DEFAULT_LNG, DEFAULT_LAT, DEFAULT_HEIGHT, 1.0);
    }

    function addAssetMarker(source, item, color, fallbackType) {
      const entityType = item.entityType || fallbackType;
      const entity = source.entities.add({
        position: Cesium.Cartesian3.fromDegrees(item.lng, item.lat),
        point: pointStyle(color, 10),

    const DEPLOYMENT_ARC_SEGMENTS = 72;
    const DEPLOYMENT_ARC_MIN_PEAK_M = 1500;
    const DEPLOYMENT_ARC_MAX_PEAK_M = 18000;
    const DEPLOYMENT_ARC_PEAK_RATIO = 0.12;

    function deploymentArcPeakHeightM(surfaceDistanceM) {
      const scaled = surfaceDistanceM * DEPLOYMENT_ARC_PEAK_RATIO;
      return Math.min(
        DEPLOYMENT_ARC_MAX_PEAK_M,
        Math.max(DEPLOYMENT_ARC_MIN_PEAK_M, scaled)
      );
    }

    function buildDeploymentArcPositions(
      originLat,
      originLng,
      destLat,
      destLng,
      peakHeightM
    ) {
      const start = Cesium.Cartographic.fromDegrees(originLng, originLat);
      const end = Cesium.Cartographic.fromDegrees(destLng, destLat);
      const geodesic = new Cesium.EllipsoidGeodesic(start, end);
      const peak = peakHeightM || deploymentArcPeakHeightM(geodesic.surfaceDistance);
      const positions = [];
      for (let i = 0; i <= DEPLOYMENT_ARC_SEGMENTS; i++) {
        const fraction = i / DEPLOYMENT_ARC_SEGMENTS;
        const point = geodesic.interpolateUsingFraction(fraction);
        const height = 4 * peak * fraction * (1 - fraction);
        positions.push(
          Cesium.Cartesian3.fromRadians(point.longitude, point.latitude, height)
        );
      }
      return positions;
    }

    function buildPath3dPositions(path3d) {
      if (!path3d || path3d.length < 2) {
        return [];
      }
      return path3d.map((point) =>
        Cesium.Cartesian3.fromDegrees(point[1], point[0], point[2] || 0)
      );
    }

    function buildFlightPathPositions(pathPoints, peakHeightM) {
      if (!pathPoints || pathPoints.length < 2) {
        return [];
      }
      const positions = [];
      for (let segment = 0; segment < pathPoints.length - 1; segment += 1) {
        const start = pathPoints[segment];
        const end = pathPoints[segment + 1];
        const arcPositions = buildDeploymentArcPositions(
          start[0],
          start[1],
          end[0],
          end[1],
          peakHeightM
        );
        const startIndex = segment === 0 ? 0 : 1;
        for (let i = startIndex; i < arcPositions.length; i += 1) {
          positions.push(arcPositions[i]);
        }
      }
      return positions;
    }

    function destinationPoint(lat, lng, bearingDeg, distanceM) {
      if (distanceM <= 0) {
        return [lat, lng];
      }
      const bearing = ((bearingDeg % 360) + 360) % 360;
      const bearingRad = Cesium.Math.toRadians(bearing);
      const latRad = Cesium.Math.toRadians(lat);
      const lngRad = Cesium.Math.toRadians(lng);
      const angular = distanceM / 6371000.0;
      const destLat = Math.asin(
        Math.sin(latRad) * Math.cos(angular) +
          Math.cos(latRad) * Math.sin(angular) * Math.cos(bearingRad)
      );
      const destLng =
        lngRad +
        Math.atan2(
          Math.sin(bearingRad) * Math.sin(angular) * Math.cos(latRad),
          Math.cos(angular) - Math.sin(latRad) * Math.sin(destLat)
        );
      return [Cesium.Math.toDegrees(destLat), Cesium.Math.toDegrees(destLng)];
    }

    function buildGeodesicRoutePositions(pathPoints) {
      if (!pathPoints || pathPoints.length < 2) {
        return [];
      }
      const positions = [];
      const segmentsPerLeg = 48;
      for (let leg = 0; leg < pathPoints.length - 1; leg += 1) {
        const startPoint = pathPoints[leg];
        const endPoint = pathPoints[leg + 1];
        const start = Cesium.Cartographic.fromDegrees(startPoint[1], startPoint[0]);
        const end = Cesium.Cartographic.fromDegrees(endPoint[1], endPoint[0]);
        const geodesic = new Cesium.EllipsoidGeodesic(start, end);
        for (let i = 0; i <= segmentsPerLeg; i += 1) {
          if (leg > 0 && i === 0) {
            continue;
          }
          const sample = geodesic.interpolateUsingFraction(i / segmentsPerLeg);
          positions.push(
            Cesium.Cartesian3.fromRadians(sample.longitude, sample.latitude, 0)
          );
        }
      }
      return positions;
    }

    function addFlightRoutePolyline(positions, options) {
      if (!positions || positions.length < 2) {

      }
      deploymentSource.entities.add({

          clampToGround: true,
          material: options.dashed

              })
            : new Cesium.PolylineArrowMaterialProperty({

              }),
        },
      });
    }

    function addRouteWaypointMarker(marker) {
      const colors = {
        takeoff: "#4ade80",
        target: "#f87171",

      };

      deploymentSource.entities.add({

          Math.max(altM, 120)

          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -14),

        },

    }

    function addDeploymentLink(item) {
      const origin = item.origin || [];
      const destination = item.destination || [];
      if (origin.length < 2 || destination.length < 2) {
        return;
      }
      const outboundRoute =
        item.outboundRoute && item.outboundRoute.length >= 2
          ? item.outboundRoute
          : item.path && item.path.length >= 2
            ? item.path
            : [origin, destination];
      const outboundTrack = buildGeodesicRoutePositions(outboundRoute);
      addFlightRoutePolyline(outboundTrack, {
        width: 7,
        color: Cesium.Color.fromCssColorString("#38bdf8").withAlpha(0.95),
      });

      if (item.returnRoute && item.returnRoute.length >= 2) {
        const returnTrack = buildGeodesicRoutePositions(item.returnRoute);
        addFlightRoutePolyline(returnTrack, {
          width: 6,
          dashed: true,
          color: Cesium.Color.fromCssColorString("#a78bfa").withAlpha(0.92),
        });
      }

      if (item.path3d && item.path3d.length >= 2) {
        deploymentSource.entities.add({
          polyline: {
            positions: buildPath3dPositions(item.path3d),
            width: 2,
            material: Cesium.Color.fromCssColorString("#7dd3fc").withAlpha(0.45),
            arcType: Cesium.ArcType.NONE,
          },
        });
      }
      if (item.returnPath3d && item.returnPath3d.length >= 2) {
        deploymentSource.entities.add({
          polyline: {
            positions: buildPath3dPositions(item.returnPath3d),
            width: 2,
            material: Cesium.Color.fromCssColorString("#c4b5fd").withAlpha(0.4),
            arcType: Cesium.ArcType.NONE,
          },
        });
      }

      const markers =
        item.routeMarkers && item.routeMarkers.length
          ? item.routeMarkers
          : item.waypoints || [];
      markers.forEach((marker) => addRouteWaypointMarker(marker));

      const entity = deploymentSource.entities.add({
        polyline: {
          positions: outboundTrack,
          width: 0,
          material: Cesium.Color.TRANSPARENT,
        },
      });
      entity.maapMeta = {
        type: "deployment",
        targetId: item.targetCardId,
        wingId: item.wingId,
        linkId: item.linkId,
      };
    }

    function teamMarkerDisplayText(side, unitType, name, radiusM) {
      const lines = [teamSideLabel(side)];

    function formatRadiusM(radiusM) {
      const value = Number(radiusM);
      if (!Number.isFinite(value) || value <= 0) {
        return "";
      }
      if (value >= 1000) {
        const km = value / 1000;
        return `R ${km >= 10 ? km.toFixed(0) : km.toFixed(1)} km`;
      }
      return `R ${value.toFixed(0)} m`;

    function formatTransportDistanceM(distanceM) {
      const value = Number(distanceM) || 0;
      if (value >= 1000) {
        return (value / 1000).toFixed(1) + " km";
      }
      return value.toFixed(0) + " m";
    }

    function formatTransportDurationMin(durationMin) {
      const total = Math.max(Math.round(Number(durationMin) || 0), 0);
      if (total < 60) {
        return total + " นาที";
      }
      const hours = Math.floor(total / 60);
      const minutes = total % 60;
      if (minutes === 0) {
        return hours + " ชม.";
      }
      return hours + " ชม. " + minutes + " นาที";
    }

    function buildGroundTransportPositions(path, oLat, oLng, dLat, dLng) {
      if (Array.isArray(path) && path.length >= 2) {
        const points = [];
        path.forEach((point) => {
          const lat = Number(point[0]);
          const lng = Number(point[1]);
          if (Number.isFinite(lat) && Number.isFinite(lng)) {
            points.push([lat, lng]);
          }
        });
        if (points.length >= 2) {
          if (points.length > 2) {
            const coords = [];
            points.forEach(([lat, lng]) => coords.push(lng, lat));
            return Cesium.Cartesian3.fromDegreesArray(coords);
          }
          return buildGeodesicPolylinePositions(points);
        }
      }
      return buildGeodesicPolylinePositions([
        [oLat, oLng],
        [dLat, dLng],
      ]);
    }

    function addGoogleDrivingRoute(positions, color, width, isRoad) {
      if (!positions || positions.length < 2) {
        return null;
      }
      const routeColor = Cesium.Color.fromCssColorString(color).withAlpha(0.98);
      if (isRoad) {
        groundTransportSource.entities.add({
          polyline: {
            positions: positions,
            width: width + 2,
            material: Cesium.Color.WHITE.withAlpha(0.85),
            clampToGround: true,
          },
        });
      }
      return groundTransportSource.entities.add({
        polyline: {
          positions: positions,
          width: width,
          material: isRoad
            ? new Cesium.PolylineArrowMaterialProperty({
                color: routeColor,
              })
            : new Cesium.PolylineDashMaterialProperty({
                color: routeColor,
                dashLength: 16,
              }),
          clampToGround: true,
        },
      });
    }

          font: "bold 11px sans-serif",

          outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
          outlineWidth: 2,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin: Cesium.VerticalOrigin.CENTER,
          horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
          pixelOffset: new Cesium.Cartesian2(0, 0),
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
      });
    }

    function setGroundTransportRoutes(items) {
      groundTransportSource.entities.removeAll();
      (items || []).forEach((item) => {
        const origin = item.origin || [];
        const destination = item.destination || [];
        if (origin.length < 2 || destination.length < 2) {
          return;
        }
        const selected = !!item.selected;
        const isRoad = String(item.routeMode || "").toLowerCase() === "road";
        const color = selected ? "#facc15" : isRoad ? "#fbbf24" : "#eab308";
        const width = selected ? 5 : isRoad ? 4 : 3;
        const oLat = Number(origin[0]);
        const oLng = Number(origin[1]);
        const dLat = Number(destination[0]);
        const dLng = Number(destination[1]);
        if (
          !Number.isFinite(oLat) ||
          !Number.isFinite(oLng) ||
          !Number.isFinite(dLat) ||
          !Number.isFinite(dLng)
        ) {
          return;
        }
        const path = item.path || [];
        const positions = buildGroundTransportPositions(path, oLat, oLng, dLat, dLng);
        const line = addGoogleDrivingRoute(positions, color, width, isRoad);
        if (line) {
          line.maapMeta = {
            type: "entity",
            entityType: "ground_transport",
            entityId: String(item.id || ""),
          };
        }

        const midIndex =
          Array.isArray(path) && path.length >= 2
            ? Math.floor(path.length / 2)
            : -1;
        const midLat =
          midIndex >= 0 ? Number(path[midIndex][0]) : (oLat + dLat) / 2;
        const midLng =
          midIndex >= 0 ? Number(path[midIndex][1]) : (oLng + dLng) / 2;
        const distanceText = formatTransportDistanceM(item.distanceM);
        const durationText = formatTransportDurationMin(item.durationMin);
        const routeModeText = item.routeModeLabel || "";
        const labelText =
          String(item.label || "ขนส่งทางบก") +
          (routeModeText ? "\n" + routeModeText : "") +
          "\n" +
          distanceText +
          " · " +
          durationText;

        groundTransportSource.entities.add({
          position: Cesium.Cartesian3.fromDegrees(midLng, midLat, 120),
          label: {
            text: labelText,
            font: "bold 11px sans-serif",
            fillColor: Cesium.Color.fromCssColorString(color),
            outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.CENTER,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
            showBackground: true,
            backgroundColor: Cesium.Color.fromCssColorString("#0f172a").withAlpha(0.72),
            backgroundPadding: new Cesium.Cartesian2(8, 5),
          },
        });

        addGroundTransportEndpoint(oLat, oLng, "A", "#22c55e");
        addGroundTransportEndpoint(dLat, dLng, "B", "#ef4444");
      });
      applyLayerVisibility();
    }

    function setLayerVisibility(layers) {
      Object.assign(layerVisibility, layers || {});
      applyLayerVisibility();
    }

    function setDetectionCaptureMode(enabled) {
      detectionCaptureMode = !!enabled;
      if (detectionCaptureMode) {
        targetSource.show = false;
        effectDomePrimitives.show = false;
        referenceSource.show = false;
        orgSource.show = false;
        depotSource.show = false;
        routeSource.show = false;
        groundTransportSource.show = false;
        deploymentSource.show = false;
        detectionSource.show = false;
        teamSource.show = false;
        borderSource.show = false;
        riskDirectionSource.show = false;
        return;
      }
      restoreMapLayersAfterDetection();
    }

    function restoreMapLayersAfterDetection() {
      detectionCaptureMode = false;
      applyLayerVisibility();
      if (selectedTargetId) {
        highlightTarget(selectedTargetId);
      }
    }

    function applyLayerVisibility() {
      if (detectionCaptureMode) {
        return;
      }
      targetSource.show = true;
      effectDomePrimitives.show = !!layerVisibility.effect_domes;
      referenceSource.show = false;
      orgSource.show = !!layerVisibility.organizations;
      depotSource.show = !!layerVisibility.depots;
      routeSource.show = !!layerVisibility.routes;
      groundTransportSource.show = !!layerVisibility.ground_transport;
      deploymentSource.show = false;
      detectionSource.show = !!layerVisibility.detections;
      teamSource.show = !!layerVisibility.teams;
      borderSource.show = !!layerVisibility.borders;
      riskDirectionSource.show = !detectionCaptureMode;
    }

    function panAndMark(lat, lng) {
      flyToDegrees(lng, lat, 2800, 1.5);
      setTimeout(() => createMarkerAt(lat, lng), 1500);
    }

    function panAndMarkReference(
      lat,
      lng,
      source,
      coordinateError,
      analysisBoundary,
      referenceRisk,
      observationRange,
      reviewArea,
      effectSummary,
      effectRadii,
      confidence,
      timestamp
    ) {
      setMapLayerSpec(
        source,
        coordinateError,
        analysisBoundary,
        referenceRisk,
        observationRange,
        reviewArea,
        effectSummary,
        effectRadii,
        confidence,
        timestamp
      );
      clearAllMarkers();
      flyToDegrees(lng, lat, 2800, 1.5);
      setTimeout(() => createMarkerAt(lat, lng), 1500);
    }

    function emitLinkMapPick(click) {
      const point = pickLatLngFromClick(click);
      if (!point) {
        return;
      }
      setLinkMode(false);
      syncMapEvent("link_map", [point[0], point[1]]);
    }

    let maapBridge = null;
    if (typeof qt !== "undefined" && qt.webChannelTransport) {
      new QWebChannel(qt.webChannelTransport, function(channel) {
        maapBridge = channel.objects.bridge;
      });
    }

    function syncMapEvent(name, values) {
      const args = (values || []).map((value) => String(value));
      if (maapBridge) {
        if (name === "link_map" && args.length >= 2) {
          maapBridge.linkMapClick(Number(args[0]), Number(args[1]));
        } else if (name === "pick_coord" && args.length >= 2) {
          maapBridge.pickCoord(Number(args[0]), Number(args[1]));
        } else if (name === "flight_route_add" && args.length >= 2) {
          maapBridge.flightRouteAdd(Number(args[0]), Number(args[1]));
        } else if (name === "flight_route_move" && args.length >= 3) {
          maapBridge.flightRouteMove(args[0], Number(args[1]), Number(args[2]));
        } else if (name === "flight_route_select" && args.length >= 1) {
          maapBridge.flightRouteSelect(args[0]);
        } else if (name === "detection_add" && args.length >= 2) {
          maapBridge.detectionAdd(Number(args[0]), Number(args[1]));
        } else if (name === "detection_select" && args.length >= 1) {
          maapBridge.detectionSelect(args[0]);
        } else if (name === "team_marker_place" && args.length >= 4) {
          maapBridge.teamMarkerPlace(
            args[0],
            args[1],
            Number(args[2]),
            Number(args[3]),
          );
        } else if (name === "team_marker_place" && args.length >= 3) {
          maapBridge.teamMarkerPlace(
            args[0],
            "generic",
            Number(args[1]),
            Number(args[2]),
          );
        } else if (name === "target_create_at" && args.length >= 2) {
          maapBridge.targetCreateAt(Number(args[0]), Number(args[1]));
        } else if (name === "select_target" && args.length >= 1) {
          maapBridge.selectTarget(args[0]);
        } else if (name === "select_entity" && args.length >= 2) {
          maapBridge.selectEntity(args[0], args[1]);
        } else if (name === "route_point_pick" && args.length >= 3) {
          maapBridge.routePointPick(args[0], Number(args[1]), Number(args[2]));
        } else if (name === "detection_ready") {
          maapBridge.detectionReady();
        } else if (name === "measure_update" && args.length >= 1) {
          maapBridge.measureUpdate(Number(args[0]), Number(args[1] || 0));
        }
        return;
      }
      document.title = "MAAP_SYNC|" + name + (args.length ? "|" + args.join("|") : "");
      // Web parent (Vue iframe) listens via postMessage — same events as desktop title sync.
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(
            { source: "maap-map", type: "map-event", name: name, args: args },
            "*"
          );
        }
      } catch (err) {
        /* ignore */
      }
    }

    function pickEntityThroughDomes(position) {
      const hits = viewer.scene.drillPick(position, 10);
      if (!hits.length) {
        return undefined;
      }
      const isDome = (hit) => hit && hit.id && hit.id.maapMeta && hit.id.maapMeta.part === "dome";
      return hits.find((hit) => !isDome(hit)) || hits[0];
    }

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction((click) => {
      if (measureMode) {
        const point = pickMeasureLatLng(click);
        if (point) {
          if (measureToolType === "radius") {
            handleRadiusClick(point[0], point[1]);
          } else {
            addMeasurePoint(point[0], point[1], point[2]);
          }
        }
        return;
      }
      if (linkMode) {
        emitLinkMapPick(click);
        return;
      }
      if (routePickMode) {
        const point = pickLatLngFromClick(click);
        if (point) {
          syncMapEvent("route_point_pick", [routePickMode, point[0], point[1]]);
        }
        return;
      }
      if (routeAddMode && flightRouteEditActive) {
        const point = pickLatLngFromClick(click);
        if (point) {
          syncMapEvent("flight_route_add", [point[0], point[1]]);
        }
        return;
      }
      if (detectionEditActive && detectionAddMode) {
        const point = pickLatLngFromClick(click);
        if (point) {
          syncMapEvent("detection_add", [point[0], point[1]]);
        }
        return;
      }
      const picked = pickEntityThroughDomes(click.position);
      if (
        Cesium.defined(picked) &&
        picked.id &&
        picked.id.maapMeta &&
        picked.id.maapMeta.type === "flight_route_waypoint"
      ) {
        if (flightRouteEditActive) {
          syncMapEvent("flight_route_select", [picked.id.maapMeta.id]);
        }
        return;
      }
      if (pickCoordMode) {
        const point = pickLatLngFromClick(click);
        if (point) {
          renderPickedCoordinate(point[0], point[1]);
        }
        return;
      }
      if (Cesium.defined(picked) && picked.id && picked.id.maapMeta) {
        const meta = picked.id.maapMeta;
        if (meta.type === "target") {
          highlightTarget(meta.id);
          document.title = "MAAP_SYNC|select_target|" + meta.id;
        } else if (meta.type === "deployment") {
          highlightTarget(meta.targetId);
          document.title = "MAAP_SYNC|select_target|" + meta.targetId;
        } else if (meta.type === "entity") {
          if (meta.entityType === "risk_object") {
            syncMapEvent("detection_select", [meta.entityId]);
            highlightDetectionObject(meta.entityId);
          }
          syncMapEvent("select_entity", [meta.entityType, meta.entityId]);
        }
        return;
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    handler.setInputAction((click) => {
      if (!flightRouteEditActive) {
        return;
      }
      const picked = pickEntityThroughDomes(click.position);
      if (
        !Cesium.defined(picked) ||
        !picked.id ||
        !picked.id.maapMeta ||
        picked.id.maapMeta.type !== "flight_route_waypoint"
      ) {
        return;
      }
      routeDragState = {
        id: picked.id.maapMeta.id,
        entity: picked.id,
        moved: false,
      };
      viewer.scene.screenSpaceCameraController.enableRotate = false;
      viewer.scene.screenSpaceCameraController.enableTranslate = false;
    }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

    handler.setInputAction((movement) => {
      if (
        !measureMode ||
        measureToolType !== "radius" ||
        !measureState.activeRadius
      ) {
        if (routeDragState && routeDragState.entity) {
          const cartesian = viewer.camera.pickEllipsoid(
            movement.endPosition,
            viewer.scene.globe.ellipsoid
          );
          if (cartesian) {
            routeDragState.entity.position = cartesian;
            routeDragState.moved = true;
          }
        }
        return;
      }
      const point = pickMeasureLatLng(movement);
      if (point) {
        measureState.activeRadius.edge = point;
        renderMeasureGraphics();
      }
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    handler.setInputAction(() => {
      if (!routeDragState) {
        return;
      }
      const entity = routeDragState.entity;
      const waypointId = routeDragState.id;
      const moved = routeDragState.moved;
      routeDragState = null;
      viewer.scene.screenSpaceCameraController.enableRotate = true;
      viewer.scene.screenSpaceCameraController.enableTranslate = true;
      if (!entity || !moved) {
        return;
      }
      const cartographic = Cesium.Cartographic.fromCartesian(
        entity.position.getValue(Cesium.JulianDate.now())
      );
      const lat = Cesium.Math.toDegrees(cartographic.latitude);
      const lng = Cesium.Math.toDegrees(cartographic.longitude);
      document.title =
        "MAAP_SYNC|flight_route_move|" + waypointId + "|" + lat + "|" + lng;
    }, Cesium.ScreenSpaceEventType.LEFT_UP);

    handler.setInputAction((click) => {
      if (!measureMode) {
        if (
          !linkMode &&
          !pickCoordMode &&
          !(routeAddMode && flightRouteEditActive) &&
          !(detectionEditActive && detectionAddMode)
        ) {
          showTeamContextMenu(click.position);
        }
        return;
      }
      if (measureToolType === "radius") {
        cancelActiveRadius();
        return;
      }
      finishActiveMeasureLine();
    }, Cesium.ScreenSpaceEventType.RIGHT_CLICK);

    handler.setInputAction(() => {
      if (!measureMode) {
        return;
      }
      if (measureToolType === "radius") {
        cancelActiveRadius();
        return;
      }
      finishActiveMeasureLine();
    }, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

    function setWingIconUrl(url) {
      if (url) {
        wingIconUrl = url;
      }
    }

    window.maapMap = {
      fitToScenario,
      panAndMark,
      panAndMarkReference,
      clearAllMarkers,
      setMapLayerSpec,
      setTargetMarkers,
      highlightTarget,
      highlightIngressCorridor,
      setLinkMode,
      fitToTarget,
      fitToDetectionArea,
      fitToTargetCard,
      setAssetLayers,
      setDetectedObjects,
      setTeamMarkers,
      setGroundTransportRoutes,
      setLayerVisibility,
      setDetectionCaptureMode,
      restoreMapLayersAfterDetection,
      setWingIconUrl,
      setStadiaApiKey,
      setCesiumIonToken,
      setBasemap,
      setMeasureMode,
      setMeasureType,
      clearMeasure,
      setPickCoordMode,
      setRouteAddMode,
      clearPickedCoordinate,
      setFlightRouteEditMode,
      setDetectionEditMode,
      setDetectionAddMode,
      highlightDetectionObject,
      updateCorridorFlightRoute,
      setTerrainEnabled,
      setAiFlightRoute,
      clearAiFlightRoute,
      setRoutePickMode,
    };

    loadCountryBorders();

    document.title = "MAP_READY";
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          { source: "maap-map", type: "map-ready" },
          "*"
        );
      }
    } catch (err) {
      /* ignore */
    }
  </script>
</body>
</html>
