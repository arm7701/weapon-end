<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAP_INIT</title>
  <script>
    // Prefer local Cesium from Vite (/cesium-static) — same app package as frontend.
    window.CESIUM_BASE_URL = "/cesium-static/";
  </script>
  <link rel="stylesheet" href="/cesium-static/Widgets/widgets.css" />
  <script src="/cesium-static/Cesium.js"></script>
  <!-- Turf is optional (detection buffers). Load async so a blocked CDN cannot blank the map. -->
  <script>
    (function loadTurfAsync() {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js";
      s.async = true;
      s.onerror = function () {
        console.warn("Turf.js failed to load; detection polygon union will be limited");
      };
      document.head.appendChild(s);
    })();
  </script>
  <!-- QWebChannel is Qt-only; load only when running inside desktop WebEngine -->
  <script>
    if (typeof qt !== "undefined" && qt.webChannelTransport) {
      var s = document.createElement("script");
      s.src = "qrc:///qtwebchannel/qwebchannel.js";
      document.head.appendChild(s);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --map-font-sans: 'IBM Plex Sans Thai', 'Inter', 'Noto Sans Thai', 'Sarabun', 'Leelawadee UI', Tahoma, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020b07;
      font-family: var(--map-font-sans);
      letter-spacing: 0.012em;
    }
    #cesiumContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020b07;
    }
    .cesium-viewer .cesium-widget-credits,
    .cesium-viewer-bottom,
    .cesium-credit-logoContainer {
      display: none !important;
    }
    body.maap-show-credits .cesium-viewer .cesium-viewer-bottom {
      display: block !important;
    }
    body.maap-show-credits .cesium-viewer .cesium-widget-credits,
    body.maap-show-credits .cesium-viewer .cesium-credit-logoContainer {
      display: inline !important;
    }
    #measureHud {
      display: none;
      position: absolute;
      top: 54px;
      left: 12px;
      z-index: 1000;
      max-width: 320px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(10, 16, 24, 0.92);
      border: 1px solid #2a3a4f;
      color: #e2e8f0;
      font: 12px/1.55 var(--map-font-sans);
      letter-spacing: 0.012em;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    #measureHud strong {
      color: #7dd3fc;
      font-size: 13px;
    }
    #measureHud .hint {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 11px;
    }
    #pickCoordHud {
      display: none;
      position: absolute;
      top: 54px;
      right: 12px;
      z-index: 1000;
      max-width: 280px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(10, 16, 24, 0.92);
      border: 1px solid #2a3a4f;
      color: #e2e8f0;
      font: 12px/1.55 var(--map-font-sans);
      letter-spacing: 0.012em;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    #pickCoordHud strong {
      color: #6ee7b7;
      font-size: 13px;
    }
    #pickCoordHud .hint {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 11px;
    }
    #teamContextMenu {
      display: none;
      position: absolute;
      z-index: 2000;
      min-width: 220px;
      padding: 6px;
      border-radius: 10px;
      background: rgba(10, 16, 24, 0.96);
      border: 1px solid #2a3a4f;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      color: #e2e8f0;
      font: 12px/1.5 var(--map-font-sans);
      letter-spacing: 0.012em;
    }
    #teamContextMenu .menu-title {
      padding: 4px 8px 8px;
      color: #94a3b8;
      font-size: 11px;
    }
    #teamContextMenu .side-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 0 4px 8px;
    }
    #teamContextMenu .side-tab {
      margin: 0;
      padding: 8px 6px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.7);
      text-align: center;
      cursor: pointer;
      font: 11px/1.4 var(--map-font-sans);
      letter-spacing: 0.012em;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #teamContextMenu .side-tab.blue {
      color: #93c5fd;
    }
    #teamContextMenu .side-tab.red {
      color: #fca5a5;
    }
    #teamContextMenu .side-tab.blue.active {
      background: rgba(59, 130, 246, 0.22);
      border-color: #3b82f6;
      color: #dbeafe;
    }
    #teamContextMenu .side-tab span {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      opacity: 0.85;
    }
    #teamContextMenu .menu-section {
      padding: 4px 8px 6px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-top: 1px solid #1e293b;
    }
    #teamContextMenu button.unit-option {
      display: block;
      width: 100%;
      margin: 0;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #e2e8f0;
      text-align: left;
      cursor: pointer;
      font: 12px/1.35 sans-serif;
    }
    #teamContextMenu button.unit-option:hover {
      background: rgba(51, 65, 85, 0.55);
      border-color: #334155;
    }
    #teamContextMenu.side-blue button.unit-option:hover {
      color: #bfdbfe;
    }
    #teamContextMenu.side-red button.unit-option:hover {
      color: #fecaca;
    }
    #teamContextMenu button.target-create-btn {
      display: block;
      width: calc(100% - 8px);
      margin: 0 4px 8px;
      padding: 9px 10px;
      border: 1px solid #166534;
      border-radius: 8px;
      background: rgba(22, 101, 52, 0.28);
      color: #bbf7d0;
      text-align: left;
      cursor: pointer;
      font: 12px/1.35 sans-serif;
    }
    #teamContextMenu button.target-create-btn:hover {
      background: rgba(22, 163, 74, 0.35);
      border-color: #22c55e;
      color: #ecfdf5;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="measureHud">
    <strong id="measureTotal">0 m</strong>
    <div id="measureSegments"></div>
    <div class="hint" id="measureHint">คลิกเพิ่มจุด · คลิกขวา/ดับเบิลคลิกจบเส้น · ปุ่ม Clear ล้างทั้งหมด</div>
  </div>
  <div id="pickCoordHud">
    <strong id="pickCoordValue">Lat —, Lng —</strong>
    <div class="hint" id="pickCoordHint">คลิกบนแผนที่เพื่อรับพิกัด</div>
  </div>
  <div id="teamContextMenu" class="side-blue">
    <div class="menu-title">เมนูแผนที่ (คลิกขวา)</div>
    <button type="button" class="target-create-btn" id="targetCreateBtn">สร้างเป้าหมายที่นี่</button>
    <div class="menu-section">เพิ่มหน่วย Blue/Red</div>
    <div class="side-tabs">
      <button type="button" class="side-tab blue active" data-side="blue">Blue<br><span>ฝ่ายเรา</span></button>
      <button type="button" class="side-tab red" data-side="red">Red<br><span>ฝ่ายตรงข้าม</span></button>
    </div>
    <div class="menu-section">ประเภทหน่วย</div>
    <button type="button" class="unit-option" data-unit="generic">ทั่วไป</button>
    <button type="button" class="unit-option" data-unit="radar">เรดาร์</button>
    <button type="button" class="unit-option" data-unit="tank">รถถัง</button>
    <button type="button" class="unit-option" data-unit="small_arms">ปืนเล็ก</button>
    <button type="button" class="unit-option" data-unit="artillery">ปืนใหญ่</button>
    <button type="button" class="unit-option" data-unit="anti_air">ปืนต่อสู้อากาศยาน</button>
  </div>
  <script>
    function notifyParent(payload) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(Object.assign({ source: "maap-map" }, payload), "*");
        }
      } catch (_err) {
        /* ignore */
      }
    }

    if (typeof Cesium === "undefined") {
      document.body.innerHTML =
        '<div style="padding:16px;color:#fecaca;font:14px sans-serif;background:#111827;height:100%">' +
        "<strong>โหลด Cesium ไม่สำเร็จ</strong><br/>ตรวจ /cesium-static/Cesium.js แล้วรีเฟรชหน้า" +
        "</div>";
      notifyParent({ type: "map-error", message: "Cesium failed to load" });
      throw new Error("Cesium failed to load");
    }

    const DEFAULT_LAT = 15.0;
    const DEFAULT_LNG = 101.0;
    const DEFAULT_HEIGHT = 1200000;
    const WING_ICON_SIZE = 72;
    const EFFECT_ZONE_DASH_LENGTH = 12;
    const EFFECT_ZONE_LINE_WIDTH = 2.5;
    const EFFECT_ZONE_LINE_WIDTH_SELECTED = 3;
    let wingIconUrl = "./icons/airport.png";
    let terrainEnabled = false;
    let terrainReady = false;
    let routePickMode = null;
    let aiRoutePickHandler = null;

    // Esri answers HTTP 200 with a grey "Map data not yet available" tile where it has
    // no imagery at that zoom; discarding it makes Cesium keep upsampling the parent tile.
    function createEsriWorldImageryProvider() {
      const base =
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile";
      return new Cesium.UrlTemplateImageryProvider({
        url: `${base}/{z}/{y}/{x}`,
        maximumLevel: 17,
        tileDiscardPolicy: new Cesium.DiscardMissingTileImagePolicy({
          missingImageUrl: `${base}/19/0/0`,
          pixelsToCheck: [
            new Cesium.Cartesian2(0, 0),
            new Cesium.Cartesian2(255, 0),
            new Cesium.Cartesian2(0, 255),
            new Cesium.Cartesian2(255, 255),
            new Cesium.Cartesian2(128, 12),
            new Cesium.Cartesian2(12, 128),
          ],
        }),
      });
    }

    let viewer;
    try {
      // Avoid Ion default imagery (needs token); start with Esri World Imagery.
      const defaultImagery = createEsriWorldImageryProvider();
      const viewerOptions = {
        animation: false,
        timeline: false,
        fullscreenButton: false,
        vrButton: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        selectionIndicator: true,
        sceneModePicker: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        requestRenderMode: false,
        contextOptions: {
          webgl: { alpha: false, preserveDrawingBuffer: true },
        },
      };
      // Cesium 1.104+ uses baseLayer; older builds used imageryProvider.
      if (Cesium.ImageryLayer) {
        viewerOptions.baseLayer = new Cesium.ImageryLayer(defaultImagery);
      } else {
        viewerOptions.imageryProvider = defaultImagery;
      }
      viewer = new Cesium.Viewer("cesiumContainer", viewerOptions);
    } catch (err) {
      const msg = (err && err.message) || String(err);
      document.body.innerHTML =
        '<div style="padding:16px;color:#fecaca;font:14px sans-serif;background:#111827;height:100%">' +
        "<strong>เปิด Cesium ไม่สำเร็จ</strong><br/>" +
        msg +
        "<br/><br/>ตรวจว่าเบราว์เซอร์รองรับ WebGL แล้วรีเฟรชหน้า" +
        "</div>";
      notifyParent({ type: "map-error", message: msg });
      throw err;
    }
    window.viewer = viewer;
    // Hide Ion/credit chrome in web embed
    try {
      if (viewer._cesiumWidget && viewer._cesiumWidget._creditContainer) {
        viewer._cesiumWidget._creditContainer.style.display = "none";
      }
      const bottoms = document.querySelectorAll(".cesium-viewer-bottom");
      bottoms.forEach((el) => {
        el.style.display = "none";
      });
    } catch (_err) {
      /* ignore */
    }

    // Center over Thailand so first paint is useful (desktop default is US view).
    try {
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(DEFAULT_LNG, DEFAULT_LAT, DEFAULT_HEIGHT),
      });
      viewer.resize();
    } catch (_err) {
      /* ignore */
    }

    // Keep canvas size in sync with iframe/container (avoids pin/click offset).
    try {
      const resizeViewer = () => {
        try {
          viewer.resize();
          viewer.scene.requestRender();
        } catch (_err) {
          /* ignore */
        }
      };
      window.addEventListener("resize", resizeViewer);
      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(() => resizeViewer());
        ro.observe(document.getElementById("cesiumContainer") || document.body);
      }
      setTimeout(resizeViewer, 50);
      setTimeout(resizeViewer, 300);
    } catch (_err) {
      /* ignore */
    }

    const DEFAULT_BASEMAP_ID = "cesium";
    let stadiaApiKey = "";

    function isStadiaBasemap(basemapId) {
      return basemapId === "stadia_satellite" || basemapId === "stadia_smooth_dark";
    }

    function setStadiaApiKey(key) {
      stadiaApiKey = String(key || "").trim();
    }

    let cesiumIonToken = "";

    function setCesiumIonToken(token) {
      cesiumIonToken = String(token || "").trim();
      if (cesiumIonToken) {
        Cesium.Ion.defaultAccessToken = cesiumIonToken;
      }
    }

    // Bing / Cesium ion terms require their attribution to stay visible while in use.
    function setCreditsVisible(visible) {
      document.body.classList.toggle("maap-show-credits", !!visible);
    }

    function createStadiaTileProvider(tilePath, ext) {
      const query = stadiaApiKey
        ? `?api_key=${encodeURIComponent(stadiaApiKey)}`
        : "";
      return new Cesium.UrlTemplateImageryProvider({
        url: `https://tiles.stadiamaps.com/tiles/${tilePath}/{z}/{x}/{y}.${ext}${query}`,
        minimumLevel: 0,
        maximumLevel: 20,
      });
    }

    const BASEMAPS = {
      stadia_satellite: {
        label: "Stadia Alidade Satellite",
        create: () => createStadiaTileProvider("alidade_satellite", "jpg"),
      },
      stadia_smooth_dark: {
        label: "Stadia Alidade Smooth Dark",
        create: () => createStadiaTileProvider("alidade_smooth_dark", "png"),
      },
      open_topo_map: {
        label: "OpenTopoMap",
        create: () =>
          new Cesium.UrlTemplateImageryProvider({
            url: "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
            subdomains: ["a", "b", "c"],
            maximumLevel: 17,
          }),
      },
      bing_aerial: {
        label: "Bing Aerial (Cesium ion)",
        requiresIonToken: true,
        showCredits: true,
        create: () => Cesium.IonImageryProvider.fromAssetId(2),
      },
      esri_world_imagery: {
        label: "Esri World Imagery",
        create: createEsriWorldImageryProvider,
      },
      cesium: {
        label: "Cesium / ดาวเทียม",
        create: createEsriWorldImageryProvider,
      },
      rtaf_50k: {
        label: "RTAF 1:50K",
        url: "https://gisportal.rtaf.mi.th/image/rest/services/Map_1_50K/ImageServer",
      },
      rtaf_250k: {
        label: "RTAF 1:250K",
        url: "https://gisportal.rtaf.mi.th/image/rest/services/Map_1_250K/ImageServer",
      },
      rtaf_500k: {
        label: "RTAF 1:500K",
        url: "https://gisportal.rtaf.mi.th/image/rest/services/Map_1_500K_RGB/ImageServer",
      },
    };

    let currentBasemapId = DEFAULT_BASEMAP_ID;
    let basemapSwitchToken = 0;

    async function createRtafImageryProvider(url) {
      try {
        return await Cesium.ArcGisMapServerImageryProvider.fromUrl(url, {
          enablePickFeatures: false,
        });
      } catch (primaryError) {
        console.warn("ArcGIS ImageServer provider failed, using export fallback", url, primaryError);
        return new Cesium.UrlTemplateImageryProvider({
          url: `${url}/export?bbox={west},{south},{east},{north}&bboxSR=4326&imageSR=4326&size=256,256&format=png&f=image`,
          tilingScheme: new Cesium.GeographicTilingScheme(),
          maximumLevel: 18,
        });
      }
    }

    async function createBasemapProvider(basemapId) {
      const spec = BASEMAPS[basemapId] || BASEMAPS[DEFAULT_BASEMAP_ID];
      if (typeof spec.create === "function") {
        return spec.create();
      }
      if (spec.url) {
        return createRtafImageryProvider(spec.url);
      }
      return BASEMAPS[DEFAULT_BASEMAP_ID].create();
    }

    async function setBasemap(basemapId) {
      let id = BASEMAPS[basemapId] ? basemapId : DEFAULT_BASEMAP_ID;
      if (isStadiaBasemap(id) && !stadiaApiKey) {
        console.warn("Stadia Maps requires an API key. Configure it in Settings > Map.");
        id = DEFAULT_BASEMAP_ID;
      }
      if (BASEMAPS[id].requiresIonToken && !cesiumIonToken) {
        console.warn("Cesium ion basemap requires an access token.");
        id = DEFAULT_BASEMAP_ID;
      }
      const token = ++basemapSwitchToken;
      try {
        const provider = await createBasemapProvider(id);
        if (token !== basemapSwitchToken) {
          return currentBasemapId;
        }
        viewer.imageryLayers.removeAll();
        viewer.imageryLayers.addImageryProvider(provider);
        currentBasemapId = id;
        setCreditsVisible(!!BASEMAPS[id].showCredits);
      } catch (error) {
        console.warn("Basemap switch failed:", id, error);
        if (id !== DEFAULT_BASEMAP_ID) {
          return setBasemap(DEFAULT_BASEMAP_ID);
        }
      }
      return currentBasemapId;
    }

    // Imagery already set via Viewer baseLayer / imageryProvider above.

    viewer.scene.globe.depthTestAgainstTerrain = false;
    viewer.scene.screenSpaceCameraController.enableRotate = true;
    viewer.scene.screenSpaceCameraController.enableTilt = true;

    const borderSource = new Cesium.CustomDataSource("borders");
    const targetSource = new Cesium.CustomDataSource("targets");
    const effectDomePrimitives = viewer.scene.primitives.add(
      new Cesium.PrimitiveCollection()
    );
    const effectTerrainCache = new Map();
    let effectTerrainGeneration = 0;
    let effectDomeEntries = [];
    const orgSource = new Cesium.CustomDataSource("organizations");
    const depotSource = new Cesium.CustomDataSource("depots");
    const routeSource = new Cesium.CustomDataSource("routes");
    const deploymentSource = new Cesium.CustomDataSource("deployments");
    const detectionSource = new Cesium.CustomDataSource("detections");
    const referenceSource = new Cesium.CustomDataSource("reference");
    const measureSource = new Cesium.CustomDataSource("measure");
    const riskDirectionSource = new Cesium.CustomDataSource("risk_direction");
    const corridorFlightSource = new Cesium.CustomDataSource("corridor_flight");
    const pickCoordSource = new Cesium.CustomDataSource("pick_coord");
    const teamSource = new Cesium.CustomDataSource("team_markers");
    const groundTransportSource = new Cesium.CustomDataSource("ground_transport");
    const aiRouteSource = new Cesium.CustomDataSource("ai_route");
    viewer.dataSources.add(borderSource);
    viewer.dataSources.add(targetSource);
    viewer.dataSources.add(orgSource);
    viewer.dataSources.add(depotSource);
    viewer.dataSources.add(routeSource);
    viewer.dataSources.add(deploymentSource);
    viewer.dataSources.add(detectionSource);
    viewer.dataSources.add(referenceSource);
    viewer.dataSources.add(measureSource);
    viewer.dataSources.add(riskDirectionSource);
    viewer.dataSources.add(corridorFlightSource);
    viewer.dataSources.add(pickCoordSource);
    viewer.dataSources.add(teamSource);
    viewer.dataSources.add(groundTransportSource);
    viewer.dataSources.add(aiRouteSource);

    async function initTerrainProvider() {
      try {
        const provider =
          await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
            "https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer"
          );
        viewer.terrainProvider = provider;
        terrainReady = true;
        if (terrainEnabled) {
          viewer.scene.globe.depthTestAgainstTerrain = true;
        }
        refineEffectTerrain(effectTerrainGeneration);
      } catch (error) {
        console.warn("Terrain provider failed to load", error);
        terrainReady = false;
      }
    }
    initTerrainProvider();

    function setTerrainEnabled(enabled) {
      terrainEnabled = !!enabled;
      if (terrainEnabled && terrainReady) {
        viewer.scene.globe.depthTestAgainstTerrain = true;
      } else {
        viewer.scene.globe.depthTestAgainstTerrain = false;
      }
    }

    const FT_TO_M = 0.3048;

    function sampleTerrainHeightM(lng, lat) {
      if (!terrainReady || !terrainEnabled) {
        return 0;
      }
      try {
        const carto = Cesium.Cartographic.fromDegrees(lng, lat);
        const h = viewer.scene.globe.getHeight(carto);
        return Number.isFinite(h) ? h : 0;
      } catch (_error) {
        return 0;
      }
    }

    function applyTerrainAglToPath3d(path3d, prefAglM, minAglM, maxAglM) {
      if (!path3d || path3d.length < 2) {
        return path3d || [];
      }
      const minAgl = Number(minAglM) || 80;
      const prefAgl = Number(prefAglM) || 105;
      const maxAgl = Number(maxAglM) || 150;
      return path3d.map((point) => {
        const lat = Number(point[0]);
        const lng = Number(point[1]);
        const terrainM = sampleTerrainHeightM(lng, lat);
        const aglM = Math.min(Math.max(prefAgl, minAgl), maxAgl);
        return [lat, lng, terrainM + aglM];
      });
    }

    function setRoutePickMode(mode) {
      routePickMode = mode || null;
      updateMapCursor();
    }

    function clearAiFlightRoute() {
      aiRouteSource.entities.removeAll();
    }

    function addAiRouteEndpoint(lat, lng, label, color) {
      aiRouteSource.entities.add({
        position: Cesium.Cartesian3.fromDegrees(lng, lat, 180),
        point: {
          pixelSize: 12,
          color: Cesium.Color.fromCssColorString(color),
          outlineColor: Cesium.Color.fromCssColorString("#0f172a"),
          outlineWidth: 2,
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
        label: {

    function addBorderFeatures(geojson) {
      const borderColor = Cesium.Color.fromCssColorString("#f8fafc").withAlpha(0.9);
      const features = (geojson && geojson.features) || [];
      for (let i = 0; i < features.length; i += 1) {
        const geometry = features[i].geometry;
        if (!geometry) {
          continue;
        }
        if (geometry.type === "LineString") {
          addBorderPolyline(geometry.coordinates, borderColor);
        } else if (geometry.type === "MultiLineString") {
          const lines = geometry.coordinates || [];
          for (let j = 0; j < lines.length; j += 1) {
            addBorderPolyline(lines[j], borderColor);
          }
        } else if (geometry.type === "Polygon") {
          const rings = geometry.coordinates || [];
          if (rings.length > 0) {
            addBorderPolyline(rings[0], borderColor);
          }
        } else if (geometry.type === "MultiPolygon") {
          const polygons = geometry.coordinates || [];
          for (let j = 0; j < polygons.length; j += 1) {
            const rings = polygons[j] || [];
            if (rings.length > 0) {
              addBorderPolyline(rings[0], borderColor);
            }
          }
        }
      }
    }

    function destinationFromBearing(lat, lng, bearingDeg, distanceM) {
      const centerCartesian = Cesium.Cartesian3.fromDegrees(lng, lat);
      const transform = Cesium.Transforms.eastNorthUpToFixedFrame(centerCartesian);
      const azimuth = Cesium.Math.toRadians(bearingDeg);
      const east = distanceM * Math.sin(azimuth);
      const north = distanceM * Math.cos(azimuth);
      const offset = new Cesium.Cartesian3(east, north, 0);
      const world = Cesium.Matrix4.multiplyByPoint(
        transform,
        offset,
        new Cesium.Cartesian3()
      );
      const carto = Cesium.Cartographic.fromCartesian(world);
      return {
        lat: Cesium.Math.toDegrees(carto.latitude),
        lng: Cesium.Math.toDegrees(carto.longitude),
      };
    }

      const options = (item.lowestRiskDirection.recommendedOptions || []).slice(0, 3);

        const option = options[i];

    function buildCirclePolylinePositions(lng, lat, radiusM, segments) {
      const count = segments || 72;
      const positions = [];
      const centerCartesian = Cesium.Cartesian3.fromDegrees(lng, lat);
      const transform = Cesium.Transforms.eastNorthUpToFixedFrame(centerCartesian);
      for (let i = 0; i <= count; i++) {
        const azimuth = (i / count) * Cesium.Math.TWO_PI;
        const east = radiusM * Math.sin(azimuth);
        const north = radiusM * Math.cos(azimuth);
        const offset = new Cesium.Cartesian3(east, north, 0);
        const world = Cesium.Matrix4.multiplyByPoint(
          transform,
          offset,
          new Cesium.Cartesian3()
        );
        positions.push(world);
      }
      return positions;
    }

    function effectCirclesOverlap(points, radiusM) {
      if (!points || points.length < 2 || !radiusM) {
        return false;
      }
      for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
          const distanceM = geodesicDistanceM(
            points[i].lat,
            points[i].lng,
            points[j].lat,
            points[j].lng
          );
          if (distanceM <= radiusM * 2) {
            return true;
          }
        }
      }
      return false;
    }

    function geometryToPolygonRings(geometry) {
      if (!geometry) {
        return [];
      }
      if (geometry.type === "Polygon") {
        return geometry.coordinates.length ? [geometry.coordinates[0]] : [];
      }
      if (geometry.type === "MultiPolygon") {
        return geometry.coordinates
          .map((polygon) => (polygon.length ? polygon[0] : null))
          .filter(Boolean);
      }
      return [];
    }

    function mergeRingUnionFeature(rings) {
      if (!rings || !rings.length || typeof turf === "undefined") {
        return null;
      }
      let merged = null;
      for (let i = 0; i < rings.length; i++) {
        const ring = rings[i];
        if (!ring || ring.length < 3) {
          continue;
        }
        const polygon = turf.polygon([ring.concat([ring[0]])]);
        if (!merged) {
          merged = polygon;
          continue;
        }
        const unioned = turf.union(turf.featureCollection([merged, polygon]));
        if (unioned) {
          merged = unioned;
        }
      }
      return merged;
    }

    function addDashedPolygonOutline(source, ring, color, outlineWidth, meta) {
      if (!ring || ring.length < 3) {

      const positions = ring.map((coord) =>
        Cesium.Cartesian3.fromDegrees(Number(coord[0]), Number(coord[1]), 0)
      );
      if (positions.length < 3) {
        return null;
      }
      const closed = positions.slice();
      closed.push(positions[0]);
      const width = outlineWidth || EFFECT_ZONE_LINE_WIDTH;
      const entity = source.entities.add({

          positions: closed,

    const EFFECT_TERRAIN_AZIMUTHS = 64;
    const EFFECT_DOME_ROWS = 14;

    function effectGroupMaxRadiusM(groupItems) {
      let maxR = 0;
      groupItems.forEach((item) => {
        (item.effectRadii || []).forEach((zone) => {
          maxR = Math.max(maxR, Number(zone.radiusM) || 0);
        });
      });
      return maxR;
    }

    function effectRadialSteps(maxR) {
      return Math.min(40, Math.max(12, Math.ceil(maxR / 15)));
    }

    function effectTerrainKey(item, maxR) {
      return `${Number(item.lat).toFixed(6)},${Number(item.lng).toFixed(6)},${Math.round(maxR)}`;
    }

    function effectAimPointEnu(item) {
      return Cesium.Transforms.eastNorthUpToFixedFrame(
        Cesium.Cartesian3.fromDegrees(item.lng, item.lat)
      );
    }

    function effectEnuOffsetCarto(enu, eastM, northM) {
      const world = Cesium.Matrix4.multiplyByPoint(
        enu,
        new Cesium.Cartesian3(eastM, northM, 0),
        new Cesium.Cartesian3()
      );
      return Cesium.Cartographic.fromCartesian(world);
    }

    // Polar grid: index 0 is the aim point, then `steps` radial samples per azimuth.
    function effectTerrainSampleCartos(item, maxR) {
      const steps = effectRadialSteps(maxR);
      const enu = effectAimPointEnu(item);
      const cartos = [Cesium.Cartographic.fromDegrees(item.lng, item.lat)];
      for (let a = 0; a < EFFECT_TERRAIN_AZIMUTHS; a++) {
        const az = (a / EFFECT_TERRAIN_AZIMUTHS) * Cesium.Math.TWO_PI;
        for (let k = 1; k <= steps; k++) {
          const d = (maxR * k) / steps;
          const carto = effectEnuOffsetCarto(enu, d * Math.sin(az), d * Math.cos(az));
          carto.height = 0;
          cartos.push(carto);
        }
      }
      return cartos;
    }

    function effectTerrainProfile(item, maxR) {
      const cached = effectTerrainCache.get(effectTerrainKey(item, maxR));
      if (cached) {
        return cached;
      }
      const h0 = viewer.scene.globe.getHeight(
        Cesium.Cartographic.fromDegrees(item.lng, item.lat)
      );
      return { maxR: maxR, steps: 0, h0: Number.isFinite(h0) ? h0 : 0, heights: null };
    }

    // Where the effect sphere (slant range from the aim point) meets the terrain,
    // so rising or falling ground pulls the zone edge inward.
    function effectZoneRim(item, profile, radiusM) {
      const enu = effectAimPointEnu(item);
      const rim = [];
      for (let a = 0; a < EFFECT_TERRAIN_AZIMUTHS; a++) {
        const az = (a / EFFECT_TERRAIN_AZIMUTHS) * Cesium.Math.TWO_PI;
        let d = radiusM;
        let h = profile.h0;
        if (profile.heights) {
          let prevD = 0;
          let prevH = profile.h0;
          let prevS = 0;
          for (let k = 1; k <= profile.steps; k++) {
            const dk = (profile.maxR * k) / profile.steps;
            const hk = profile.heights[1 + a * profile.steps + (k - 1)];
            const sk = Math.hypot(dk, hk - profile.h0);
            if (sk >= radiusM) {
              const t = sk > prevS ? (radiusM - prevS) / (sk - prevS) : 0;
              d = prevD + t * (dk - prevD);
              h = prevH + t * (hk - prevH);
              break;
            }
            prevD = dk;
            prevH = hk;
            prevS = sk;
          }
        }
        const carto = effectEnuOffsetCarto(enu, d * Math.sin(az), d * Math.cos(az));
        rim.push({
          az: az,
          d: d,
          dh: h - profile.h0,
          lat: Cesium.Math.toDegrees(carto.latitude),
          lng: Cesium.Math.toDegrees(carto.longitude),
        });
      }
      return rim;
    }

    function addTargetEffectZoneForPoints(groupItems, effectItem, selected) {
      const radiusM = Math.max(0, effectItem.radiusM || 0);
      if (!radiusM) {
        return;
      }
      const color = effectItem.color || "#E8FF88";
      const outlineWidth = selected
        ? EFFECT_ZONE_LINE_WIDTH_SELECTED
        : EFFECT_ZONE_LINE_WIDTH;
      const points = groupItems.map((item) => ({
        lat: item.lat,
        lng: item.lng,
        radiusM: radiusM,
      }));
      const maxR = Math.max(radiusM, effectGroupMaxRadiusM(groupItems));
      const rims = groupItems.map((item) =>
        effectZoneRim(item, effectTerrainProfile(item, maxR), radiusM).map((p) => [
          p.lng,
          p.lat,
        ])
      );
      const metaBase = {
        type: "target",
        id: groupItems[0].targetCardId,
        part: "effect",
        zone: effectItem.zone || "",
        color: color,
        merged: false,
      };

      if (
        groupItems.length > 1 &&
        effectCirclesOverlap(points, radiusM) &&
        typeof turf !== "undefined"
      ) {
        const merged = mergeRingUnionFeature(rims);
        const rings = geometryToPolygonRings(merged && merged.geometry);
        if (rings.length) {
          rings.forEach((ring) => {
            addDashedPolygonOutline(
              targetSource,
              ring,
              color,
              outlineWidth,
              Object.assign({}, metaBase, { merged: true })
            );
          });
          return;
        }
      }

      rims.forEach((ring) => {
        addDashedPolygonOutline(
          targetSource,
          ring,
          color,
          outlineWidth,
          Object.assign({}, metaBase, { merged: false })
        );
      });
    }

    function addTargetEffectRadiiForGroup(groupItems, selected) {
      const template = (groupItems[0] && groupItems[0].effectRadii) || [];
      const radii = template
        .slice()
        .sort((a, b) => (b.radiusM || 0) - (a.radiusM || 0));
      for (let i = 0; i < radii.length; i++) {
        addTargetEffectZoneForPoints(groupItems, radii[i], selected);
      }
    }

    function effectDomeAlpha(selected) {
      return selected ? 0.16 : 0.09;
    }

    function addTargetEffectDomes(groupItems) {
      const maxR = effectGroupMaxRadiusM(groupItems);
      groupItems.forEach((item) => {
        const profile = effectTerrainProfile(item, maxR);
        const zones = (item.effectRadii || [])
          .filter((zone) => (zone.radiusM || 0) > 0)
          .sort((a, b) => (b.radiusM || 0) - (a.radiusM || 0))
          .map((zone) => ({
            radiusM: zone.radiusM,
            color: zone.color || "#E8FF88",
            rim: effectZoneRim(item, profile, zone.radiusM),
          }));
        if (zones.length) {
          effectDomeEntries.push({ item: item, h0: profile.h0, zones: zones });
        }
      });
    }

    function buildEffectDomeGeometry(item, h0, zone) {
      const radiusM = zone.radiusM;
      const rim = zone.rim;
      const n = rim.length;
      const rows = EFFECT_DOME_ROWS;
      const enu = Cesium.Transforms.eastNorthUpToFixedFrame(
        Cesium.Cartesian3.fromDegrees(item.lng, item.lat, h0)
      );
      const vertexCount = n * rows + 1;
      const positions = new Float64Array(vertexCount * 3);
      const local = new Cesium.Cartesian3();
      const world = new Cesium.Cartesian3();
      let p = 0;
      const pushLocal = () => {
        Cesium.Matrix4.multiplyByPoint(enu, local, world);
        positions[p++] = world.x;
        positions[p++] = world.y;
        positions[p++] = world.z;
      };
      rim.forEach((point) => {
        const east = Math.sin(point.az);
        const north = Math.cos(point.az);
        const phi0 = Math.atan2(point.dh, point.d);
        for (let j = 0; j < rows; j++) {
          if (j === 0) {
            local.x = point.d * east;
            local.y = point.d * north;
            local.z = point.dh;
          } else {
            const phi = phi0 + (Cesium.Math.PI_OVER_TWO - phi0) * (j / rows);
            const horizontal = radiusM * Math.cos(phi);
            local.x = horizontal * east;
            local.y = horizontal * north;
            local.z = radiusM * Math.sin(phi);
          }
          pushLocal();
        }
      });
      local.x = 0;
      local.y = 0;
      local.z = radiusM;
      pushLocal();

      const apex = vertexCount - 1;
      const indices = Cesium.IndexDatatype.createTypedArray(
        vertexCount,
        n * (rows - 1) * 6 + n * 3
      );
      let q = 0;
      for (let a = 0; a < n; a++) {
        const b = (a + 1) % n;
        for (let j = 0; j < rows - 1; j++) {
          const a0 = a * rows + j;
          const b0 = b * rows + j;
          indices[q++] = a0;
          indices[q++] = b0;
          indices[q++] = b0 + 1;
          indices[q++] = a0;
          indices[q++] = b0 + 1;
          indices[q++] = a0 + 1;
        }
        indices[q++] = a * rows + rows - 1;
        indices[q++] = b * rows + rows - 1;
        indices[q++] = apex;
      }
      return new Cesium.Geometry({
        attributes: {
          position: new Cesium.GeometryAttribute({
            componentDatatype: Cesium.ComponentDatatype.DOUBLE,
            componentsPerAttribute: 3,
            values: positions,
          }),
        },
        indices: indices,
        primitiveType: Cesium.PrimitiveType.TRIANGLES,
        boundingSphere: Cesium.BoundingSphere.fromVertices(positions),
      });
    }

    function renderEffectDomes() {
      effectDomePrimitives.removeAll();
      const instances = [];
      effectDomeEntries.forEach((entry) => {
        const selected = entry.item.targetCardId === selectedTargetId;
        entry.zones.forEach((zone) => {
          instances.push(
            new Cesium.GeometryInstance({
              geometry: buildEffectDomeGeometry(entry.item, entry.h0, zone),
              id: {
                maapMeta: {
                  type: "target",
                  id: entry.item.targetCardId,
                  part: "dome",
                  color: zone.color,
                },
              },
              attributes: {
                color: Cesium.ColorGeometryInstanceAttribute.fromColor(
                  Cesium.Color.fromCssColorString(zone.color).withAlpha(
                    effectDomeAlpha(selected)
                  )
                ),
              },
            })
          );
        });
      });
      if (!instances.length) {
        return;
      }
      effectDomePrimitives.add(
        new Cesium.Primitive({
          geometryInstances: instances,
          appearance: new Cesium.PerInstanceColorAppearance({
            flat: true,
            translucent: true,
            closed: false,
          }),
          asynchronous: false,
        })
      );
    }

    async function refineEffectTerrain(generation) {
      if (!terrainReady) {
        return;
      }
      const grouped = {};
      targetMarkersCache.forEach((item) => {
        (grouped[item.targetCardId] = grouped[item.targetCardId] || []).push(item);
      });
      const pending = new Map();
      Object.values(grouped).forEach((groupItems) => {
        const maxR = effectGroupMaxRadiusM(groupItems);
        if (maxR <= 0) {
          return;
        }
        groupItems.forEach((item) => {
          const key = effectTerrainKey(item, maxR);
          if (!effectTerrainCache.has(key) && !pending.has(key)) {
            pending.set(key, {
              key: key,
              maxR: maxR,
              cartos: effectTerrainSampleCartos(item, maxR),
            });
          }
        });
      });
      if (!pending.size) {
        return;
      }
      const jobs = Array.from(pending.values());
      try {
        const cartos = [];
        jobs.forEach((job) => job.cartos.forEach((c) => cartos.push(c)));
        const sampled = await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, cartos);
        let offset = 0;
        jobs.forEach((job) => {
          const n = job.cartos.length;
          const raw = sampled.slice(offset, offset + n).map((c) => c.height);
          offset += n;
          const h0 = Number.isFinite(raw[0]) ? raw[0] : 0;
          effectTerrainCache.set(job.key, {
            maxR: job.maxR,
            steps: effectRadialSteps(job.maxR),
            h0: h0,
            heights: raw.map((h) => (Number.isFinite(h) ? h : h0)),
          });
        });
      } catch (error) {
        console.warn("Terrain sampling for effect zones failed", error);
        return;
      }
      if (generation === effectTerrainGeneration) {
        setTargetMarkers(targetMarkersCache);
      }
    }

    function addTargetEffectRadii(item, selected) {
      addTargetEffectRadiiForGroup([item], selected);
    }

    function maxTargetFocusRadiusM(item) {
      if (!item) {
        return 0;
      }
      let focus = Math.max(0, item.radiusM || 0, footprintHalfDiagonalM(item));
      const radii = item.effectRadii || [];
      for (let i = 0; i < radii.length; i++) {
        focus = Math.max(focus, radii[i].radiusM || 0);
      }
      return focus;
    }

    function cameraHeightForRadiusM(radiusM) {
      const radius = Math.max(radiusM || 0, 8);
      return Math.min(Math.max(radius * 22, 320), 10000);
    }

    let targetMarkersCache = [];

    function addTargetRadiusCircle(item, selected) {
      const radiusM = Math.max(0, item.radiusM || 0);
      if (!radiusM) {
        return null;
      }
      const color = selected ? "#FFD700" : "#44AAFF";
      const circle = addCircleEntity(
        targetSource,
        item.lng,
        item.lat,
        radiusM,
        color,
        selected ? 0.2 : 0.14
      );
      if (circle) {
        circle.maapMeta = {
          type: "target",
          id: item.targetCardId,
          part: "radius",
        };
      }
      return circle;
    }

    const FOOTPRINT_COLOR = "#FB923C";
    const FOOTPRINT_COLOR_SELECTED = "#FFD700";

    function footprintFillAlpha(selected) {
      return selected ? 0.42 : 0.3;
    }

    function addTargetFootprint(item, selected) {
      const footprint = item && item.footprint;
      const ring = (footprint && footprint.polygon) || [];
      if (ring.length < 3) {
        return;
      }
      const flatDegrees = [];
      ring.forEach((corner) => {
        flatDegrees.push(corner[1], corner[0]);
      });
      const color = selected ? FOOTPRINT_COLOR_SELECTED : FOOTPRINT_COLOR;
      const heightM = Math.max(0, footprint.heightM || 0);
      const polygon = {
        hierarchy: Cesium.Cartesian3.fromDegreesArray(flatDegrees),
        material: Cesium.Color.fromCssColorString(color).withAlpha(
          footprintFillAlpha(selected)
        ),
      };
      if (heightM > 0) {
        polygon.height = 0;
        polygon.heightReference = Cesium.HeightReference.RELATIVE_TO_GROUND;
        polygon.extrudedHeight = heightM;
        polygon.extrudedHeightReference = Cesium.HeightReference.RELATIVE_TO_GROUND;
      } else {
        polygon.heightReference = Cesium.HeightReference.CLAMP_TO_GROUND;
        polygon.classificationType = Cesium.ClassificationType.BOTH;
      }
      const dims =
        "ขนาดจริง " +
        Number(footprint.lengthM).toFixed(1) +
        " × " +
        Number(footprint.widthM).toFixed(1) +
        " ม." +
        (heightM > 0 ? " · สูง " + heightM.toFixed(1) + " ม." : "") +
        " · ทิศ " +
        Math.round(footprint.headingDeg || 0) +
        "°";
      const dimsLabel = labelStyle(dims, "#FED7AA", "#431407");
      dimsLabel.font = "11px sans-serif";
      dimsLabel.verticalOrigin = Cesium.VerticalOrigin.TOP;
      dimsLabel.pixelOffset = new Cesium.Cartesian2(0, 12);
      dimsLabel.distanceDisplayCondition = new Cesium.DistanceDisplayCondition(0, 6000);
      const body = targetSource.entities.add({
        position: Cesium.Cartesian3.fromDegrees(item.lng, item.lat),
        polygon: polygon,
        label: dimsLabel,
      });
      body.maapMeta = {
        type: "target",
        id: item.targetCardId,
        part: "footprint",
      };

      const outlinePositions = Cesium.Cartesian3.fromDegreesArray(
        flatDegrees.concat([flatDegrees[0], flatDegrees[1]])
      );
      const outline = targetSource.entities.add({
        polyline: {
          positions: outlinePositions,
          width: selected ? 3 : 2,
          clampToGround: true,
          material: Cesium.Color.fromCssColorString(color).withAlpha(0.95),
        },
      });
      outline.maapMeta = {
        type: "target",
        id: item.targetCardId,
        part: "footprint-outline",
      };
    }

    function footprintHalfDiagonalM(item) {
      const footprint = item && item.footprint;
      if (!footprint) {
        return 0;
      }
      return Math.hypot(footprint.lengthM || 0, footprint.widthM || 0) / 2;
    }

    function targetMarkersForCard(targetCardId) {
      return targetMarkersCache.filter((item) => item.targetCardId === targetCardId);
    }

    function primaryTargetMarker(targetCardId) {
      const markers = targetMarkersForCard(targetCardId);
      return (
        markers.find((item) => item.isPrimary) ||
        markers[0] ||
        null
      );
    }

    function addTargetPointConnector(items) {
      if (!items || items.length < 2) {
        return;
      }
      const sorted = items
        .slice()
        .sort((a, b) => (a.pointIndex || 0) - (b.pointIndex || 0));
      const positions = buildGeodesicPolylinePositions(
        sorted.map((item) => [item.lat, item.lng])
      );
      if (positions.length < 2) {
        return;
      }
      const entity = targetSource.entities.add({
        polyline: {
          positions: positions,
          width: 2,
          clampToGround: true,
          material: new Cesium.PolylineDashMaterialProperty({
            color: Cesium.Color.fromCssColorString("#f87171").withAlpha(0.75),
            dashLength: 10.0,
          }),
        },
      });
      entity.maapMeta = {
        type: "target",
        id: sorted[0].targetCardId,
        part: "connector",
      };
    }

    function setTargetMarkers(items) {
      targetMarkersCache = items || [];
      targetSource.entities.removeAll();
      effectDomeEntries = [];
      const grouped = {};
      targetMarkersCache.forEach((item) => {
        if (!grouped[item.targetCardId]) {
          grouped[item.targetCardId] = [];
        }
        grouped[item.targetCardId].push(item);
      });
      Object.keys(grouped).forEach((targetCardId) => {
        const groupItems = grouped[targetCardId];
        const selected = targetCardId === selectedTargetId;
        const primaryItem =
          groupItems.find((item) => item.isPrimary) || groupItems[0];
        addTargetPointConnector(groupItems);
        addTargetEffectRadiiForGroup(groupItems, selected);
        addTargetEffectDomes(groupItems);
        groupItems.forEach((item) => addTargetFootprint(item, selected));
        groupItems.forEach((item) => {
          const isPrimary = !!item.isPrimary || item === primaryItem;
          addTargetRadiusCircle(item, selected);
          const pointColor =
            item.targetCardId === selectedTargetId
              ? isPrimary
                ? "#FFD700"
                : "#F59E0B"
              : isPrimary
                ? "#FF0000"
                : "#FB7185";
          const pointSize =
            item.targetCardId === selectedTargetId
              ? isPrimary
                ? 12
                : 10
              : isPrimary
                ? 9
                : 8;
          const entity = targetSource.entities.add({
            position: Cesium.Cartesian3.fromDegrees(item.lng, item.lat),
            point: pointStyle(pointColor, pointSize),
            label: labelStyle(item.label || "Target", isPrimary ? "#00FF66" : "#fda4af"),
          });
          entity.maapMeta = {
            type: "target",
            id: item.targetCardId,
            part: "point",
            coordinateId: item.coordinateId || null,
            isPrimary: isPrimary,
          };
        });
      });
      renderEffectDomes();
      effectTerrainGeneration += 1;
      refineEffectTerrain(effectTerrainGeneration);
      if (selectedTargetId) {
        drawRiskDirectionForTarget(selectedTargetId);
      } else {
        clearRiskDirectionArrows();
      }
    }

    function highlightTarget(targetCardId) {
      selectedTargetId = targetCardId;
      ingressCorridorFocus = null;
      clearIngressCorridorFlightRoute();
      const entities = targetSource.entities.values;
      for (let i = 0; i < entities.length; i++) {
        const entity = entities[i];
        if (!entity.maapMeta || entity.maapMeta.type !== "target") {
          continue;
        }
        const selected = entity.maapMeta.id === targetCardId;
        if (entity.maapMeta.part === "point") {
          const isPrimary = entity.maapMeta.isPrimary !== false;
          const pointColor = selected
            ? isPrimary
              ? "#FFD700"
              : "#F59E0B"
            : isPrimary
              ? "#FF0000"
              : "#FB7185";
          const pointSize = selected ? (isPrimary ? 12 : 10) : isPrimary ? 9 : 8;
          entity.point = pointStyle(pointColor, pointSize);
        }
        if (entity.maapMeta.part === "radius" && entity.ellipse) {
          const color = selected ? "#FFD700" : "#44AAFF";
          entity.ellipse.material = Cesium.Color.fromCssColorString(color).withAlpha(
            selected ? 0.2 : 0.14
          );
          entity.ellipse.outlineColor = Cesium.Color.fromCssColorString(color).withAlpha(0.9);
        }
        if (entity.maapMeta.part === "footprint" && entity.polygon) {
          const color = selected ? FOOTPRINT_COLOR_SELECTED : FOOTPRINT_COLOR;
          entity.polygon.material = Cesium.Color.fromCssColorString(color).withAlpha(
            footprintFillAlpha(selected)
          );
        }
        if (entity.maapMeta.part === "footprint-outline" && entity.polyline) {
          const color = selected ? FOOTPRINT_COLOR_SELECTED : FOOTPRINT_COLOR;
          entity.polyline.width = selected ? 3 : 2;
          entity.polyline.material = Cesium.Color.fromCssColorString(color).withAlpha(0.95);
        }
        if (entity.maapMeta.part === "effect" && entity.polyline) {
          const baseColor = entity.maapMeta.color || "#E8FF88";
          entity.polyline.width = selected
            ? EFFECT_ZONE_LINE_WIDTH_SELECTED
            : EFFECT_ZONE_LINE_WIDTH;
          entity.polyline.material = new Cesium.PolylineDashMaterialProperty({
            color: Cesium.Color.fromCssColorString(baseColor).withAlpha(
              selected ? 1.0 : 0.95
            ),
            dashLength: EFFECT_ZONE_DASH_LENGTH,
          });
        }
      }
      renderEffectDomes();
      if (targetCardId) {
        drawRiskDirectionForTarget(targetCardId);
        fitToTargetCard(targetCardId);
      } else {
        clearRiskDirectionArrows();
      }
    }
