apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{IMAGE_NAME}}-deployment
  namespace: {{NAMESPACE}}
  labels:
    app: {{IMAGE_NAME}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{IMAGE_NAME}}
  template:
    metadata:
      labels:
        app: {{IMAGE_NAME}}
    spec:
      imagePullSecrets:
        - name: {{PULL_SECRET}}
      containers:
        - name: {{IMAGE_NAME}}
          image: {{PULL_IMAGE}}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - name: http
              containerPort: {{CONTAINER_PORT}}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: {{CONTAINER_PORT}}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{CONTAINER_PORT}}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{IMAGE_NAME}}-service
  namespace: {{NAMESPACE}}
  labels:
    app: {{IMAGE_NAME}}
spec:
  selector:
    app: {{IMAGE_NAME}}
  ports:
    - protocol: TCP
      port: {{TCP_PORT}}
      targetPort: {{CONTAINER_PORT}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{IMAGE_NAME}}-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: {{IMAGE_NAME}}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: {{HOST_NAME}}
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: {{IMAGE_NAME}}-service
                port:
                  number: {{TCP_PORT}}
