[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maap-wargame-simulation"
version = "0.1.0"
description = "MAAP wargame training simulation (desktop original) + Weaponeering web API."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PySide6-Addons>=6.7",
    "pydantic>=2.0",
]

[tool.setuptools.package-data]
"maap_app.ui.map" = ["assets/**/*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
detection = [
    "ultralytics>=8.3",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.scripts]
maap-app = "maap_app.main:main"
weaponeering-api = "weaponeering_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
